openapi: 3.1.0
info:
  version: 1.0.0
  title: Institutional Vault
  description: Institutional Vault API - wallet management and Core Wallet Platform (CWP)
  contact:
    name: Blockdaemon
    url: https://vault.docs.blockdaemon.com
servers:
  - url: https://{domain}
    variables:
      domain:
        default: api.your-wallet.blockdaemon-wallet.com
        description: The domain name of the server
tags:
  - name: Assets
    x-displayName: Assets
  - name: Audit
    x-displayName: Audit
  - name: Compliance
    x-displayName: Compliance
  - name: Config
    x-displayName: Config
  - name: Groups
    x-displayName: Groups
  - name: Cold Wallet
    x-displayName: Cold Wallet
  - name: Users
    x-displayName: Users
  - name: Accounts
    x-displayName: Accounts
  - name: Notifications
    x-displayName: Notifications
  - name: Operations
    x-displayName: Operations
  - name: Staking
    x-displayName: Staking
  - name: System User
    x-displayName: System User
  - name: Tenants
    x-displayName: Tenants
  - name: Transactions
    x-displayName: Transactions
  - name: Health
    x-displayName: Health
  - name: Addresses
    description: Derive addresses, resolve address ownership, and Solana account metadata.
    x-displayName: Addresses
  - name: Policies
    description: Read policy restrictions and start restriction update operations.
    x-displayName: Policies
  - name: Events
    description: Subscribe to events over WebSocket.
    x-displayName: Events
  - name: Prices
    description: Look up USD prices for registered assets.
    x-displayName: Prices
  - name: Balances
    x-displayName: Balances
  - name: WalletConnect
    x-displayName: WalletConnect
paths:
  /api/assets:
    get:
      tags:
        - Assets
      summary: Get a List of Assets
      description: >-
        Retrieve a summary of all assets including the asset type, total balance
        and amount in USD.
      operationId: getAllAssetsSummary
      parameters:
        - schema:
            type: string
          description: If set, exclude all entries which are empty
          name: exclude_empty
          in: query
        - schema:
            type: boolean
          description: If set, only return stakeable assets
          name: stakeable_only
          in: query
        - schema:
            type: integer
          description: Page number
          name: page
          in: query
          required: true
        - schema:
            type: integer
          description: Number of entries per page
          name: pageSize
          in: query
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSummaryOfAllAssetsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/assets/addAddress:
    post:
      deprecated: true
      tags:
        - Assets
      summary: Add an Additional Address to an Asset
      description: >-
        Adds an address to the asset uniquely specified by VaultId and Asset.
        The name specified for the address must be unique. Be aware that this
        endpoint will not work for ethereum assets, since it is only possible to
        have a single address for such assets.
      operationId: addAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/supported-assets:
    get:
      deprecated: true
      tags:
        - Assets
      summary: Return a list of supported assets
      description: >-
        Returns all assets supported by this wallet, including native L1 assets
        and imported tokens (ERC-20, SPL, Canton CIP56).
      operationId: getSupportedAssets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSupportedAssetsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - Assets
      summary: Add Support for an Additional ERC20, SPL, or Canton CIP56 Token Asset
      description: >
        Adds support for a new token asset. Use `Blockchain` to select the
        variant:

        `ethereum`, `polygon`, `base`, or `besu` with `ContractAddress` for
        ERC-20;

        `solana` with `ContractAddress` for SPL; `canton` with `InstrumentID`
        and

        `RegistrarPartyID` for Canton CIP56 tokens.
      operationId: addBlockchainSupportedAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddBlockchainSupportedAssetRequest'
            examples:
              erc20_ethereum:
                summary: ERC-20 (Ethereum)
                value:
                  Blockchain: ethereum
                  ContractAddress: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
              spl_solana:
                summary: SPL token (Solana)
                value:
                  Blockchain: solana
                  ContractAddress: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              canton_cip56:
                summary: Canton CIP56 (registrar + instrument)
                value:
                  Blockchain: canton
                  InstrumentID: Tebirkes
                  RegistrarPartyID: >-
                    e012e47b-fc89-46a7-8907-156d90e147b7::1220367a02fe2a1dd6e32a2ac65403b2215e0c6d2a07d6f47d0ec1b9636840cbaf9d
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAsyncOperationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
