  /api/vaults/{id}/assets/{caip19}/cold:
    post:
      tags:
        - Accounts
      summary: Add Solana Asset to Cold Vault
      description: >
        Initiates the creation of a Solana Nonce account for a cold (offline)
        account, enabling offline transaction signing.

        This is required before a cold vault can send Solana transactions.


        The operation creates a durable nonce account on Solana which replaces
        the recent blockhash requirement,

        allowing transactions to be signed offline and submitted at any later
        time.


        A hot (online) account with SOL balance is required to pay for the nonce
        account creation (rent-exempt balance + fees).
      operationId: addSolanaColdAsset
      parameters:
        - schema:
            type: integer
            format: int64
          description: ID of the cold vault to add the Solana asset to
          name: id
          in: path
          required: true
        - schema:
            $ref: '#/components/schemas/CAIP19'
          description: CAIP-19 identifier of the Solana asset (URL-encoded)
          name: caip19
          in: path
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSolanaColdAssetRequest'
      responses:
        '202':
          description: Accepted - Operation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddSolanaColdAssetResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
