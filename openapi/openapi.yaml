  /api/cwp/operations/start/makeTransaction:
    post:
      tags:
        - Transactions
      summary: Make Transaction
      description: >-
        Start an async Make Transaction operation. With structured `Destination`
        (and optional `EVM` / chain-specific fields), creates, signs, and
        broadcasts the transaction when complete. With `RawTransaction` (and
        optional `TxHash` for Canton prepared submission), MPC signing only—the
        operation does **not** broadcast; the response includes
        `SignedTransaction` and the integrator must submit the signed bytes to
        the network. Requires `Source` as `AddressSpec` and `CAIP19`. Status can
        be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartMakeTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpMakeTransactionStartRequest'
            examples:
              structuredErc20Transfer:
                summary: Structured ERC-20 transfer (single destination)
                value:
                  CAIP19: eip155:1/erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
                  Source:
                    MasterKeyName: Default
                    AccountName: treasury
                    AddressIndex: 0
                  Destination:
                    - Address: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb0'
                      Amount: '100.00'
              evmContractCall:
                summary: >-
                  EVM ERC-20 transfer via contract call (`EVM.Data`, destination
                  = token contract)
                value:
                  CAIP19: eip155:560048/slip44:60
                  TestNetwork: true
                  Source:
                    Address: '0xe04B031223A1D3c9AC5cfDfe3364b356d98970dC'
                  Destination:
                    - Address: '0x21741b361292bbf43c5069d2477c159494071aff'
                      Amount: '0'
                  EVM:
                    Data: >-
                      0xa9059cbb00000000000000000000000016429055827a6863d291d6bdd63cbb71a3e85d60000000000000000000000000000000000000000000000000197e4dfa9e4936c00
              evmRawContractDeploy:
                summary: >-
                  EVM contract deploy (`RawTransaction` only; MPC sign,
                  integrator broadcasts `SignedTransaction`)
                description: >-
                  Omit `Destination`. Build the unsigned EIP-1559 transaction
                  locally (e.g. viem `serializeTransaction` with contract
                  `data`); pass the hex as `RawTransaction`. `RawTransaction`
                  below is truncated for documentation—use the full serialized
                  tx from your client.
                value:
                  CAIP19: eip155:560048/slip44:60
                  TestNetwork: true
                  Source:
                    Address: '0x16429055827A6863d291D6bDd63cBB71A3E85d60'
                  RawTransaction: >-
