  /api/assets/getExchangeRates:
    get:
      tags:
        - Assets
      summary: Get a List of Assets and Their Exchange Rate
      description: >-
        Retrieves a list of all assets and their respective exchange rate. The
        list is in descending order based on the USDRate. If the asset does not
        have an exchange rate, USDRate will be set to null. If the asset has a
        pending exchange rate update the PendingUSDRate field will be set, if
        not it will be null
      operationId: getExchangeRates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllExchangeRatesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/assets/setExchangeRate:
    post:
      deprecated: true
      tags:
        - Assets
      summary: Set Exchange Rate of an Asset
      description: >-
        Sets the exchange rate of asset specified by asset.The Rate should be
        set in USD. You can either set a fixed rate or set a range the rate is
        allowed to move in. If the range is set, the rate will be set by
        querying 3'rd parties and used so long they are in the given range. The
        exchange rate can only be set on assets with "Status" = "Success"
      operationId: setExchangeRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetExchangeRateRequest'
            examples:
              fixed-rate:
                description: Set fixed exchange rate
                value:
                  SetExchangeRates:
                    - Asset: ETH
                      USDRate: '2000.0'
              rate-range:
                description: Set exchange rate range
                value:
                  SetExchangeRates:
                    - Asset: ETH
                      USDMin: '1800.0'
                      USDMax: '2200.0'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetExchangeRateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
