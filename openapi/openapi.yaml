  /api/cwp/operations/search:
    post:
      tags:
        - Operations
      summary: Search operations
      description: >-
        **Deprecated:** Prefer [`POST
        /operations/searchInfos`](#/paths/~1operations~1searchInfos/post) when
        you need a stable sort or pagination without unmarshalling full intents.
        Returns operations' intents matching the filter. If `Statuses` is
        omitted or empty, only operations that are not in a final state
        (`Succeeded` or `Failed`) are included. There is **no limit** field on
        the filter; this endpoint may return unbounded payloads. Matches are
        returned in **arbitrary order** (not ordered by creation time). The 200
        response body is a **`ListOperationsResult`**: `Intents` is a JSON array
        of **stored intent objects** (standard `application/json` encoding of
        each intent struct). Each element matches one variant of
        **`IntentItem`** when the operation type is still startable over HTTP;
        use the object's **`OperationType`** field to select the variant. Older
        operation types that can no longer be started (for example `transfer`,
        `add ERC20 asset`) may still appear in responses but are omitted from
        the `IntentItem` union. This is not a base64 blob, `json.RawMessage`, or
        double-encoded JSON string layer. Returned intents include common
        metadata when present: `OperationType`, optional `OperationID` and
        `InitiatorID`, and server fields such as `Timestamp` and `InitiatorName`
        (see each variant under `IntentItem`).
      operationId: cwpsearchOperations
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpOperationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpListOperationsResult'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/searchInfos:
    post:
      tags:
        - Operations
      summary: Search operation summaries
      description: >-
        Returns lightweight metadata. for operations matching `Filter`. Results
        are ordered by `CreatedTime` descending, with `OperationID` as a
        tiebreaker (also descending). If `Statuses` is omitted or empty, only
        operations that are not in a final state (`Succeeded` or `Failed`) are
        included. Use `Pagination.Size` to cap how many rows are returned per
        call. When more rows remain, `PaginationToken` is non-empty — pass its
        value as `Pagination.Token` on the next request. If `Pagination.Size` is
        zero or omitted, all matching rows are returned in one response and
        `PaginationToken` is empty.
      operationId: cwpsearchOperationInfos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpSearchOperationInfosRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpSearchOperationInfosResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
