    ProblemDetails:
      required:
        - CorrelationId
        - Status
        - Title
        - Type
      properties:
        CorrelationId:
          description: >-
            CorrelationId is a convenience field since it's also declared as
            normal in the response header
          type: string
        Detail:
          description: >-
            Detail is a human-readable explanation specific to this occurrence
            of the problem. If present, it ought to focus on helping the client
            correct the problem, rather than giving debugging information
          type: string
        ErrorCode:
          description: >-
            ErrorCode denotes a fine-grained way of defining application
            specific errors
          type: string
          enum:
            - '10000'
            - '20000'
            - '20001'
            - '20002'
            - '20010'
            - '30000'
            - '30001'
            - '30002'
            - '30003'
            - '30004'
            - '40001'
            - '40002'
            - '50000'
            - '50001'
            - '60000'
            - '70001'
            - '70002'
            - '70003'
            - '70004'
            - '90000'
            - '90010'
            - '90100'
            - '90200'
            - '90300'
        Errors:
          description: >-
            Errors is a list of validation errors which is present only if the
            Status is 400
          type: array
          items:
            $ref: '#/components/schemas/Error'
        Instance:
          description: >-
            Instance is a URI reference that identifies the specific occurrence
            of the problem.  It may or may not yield further information if
            dereferenced.
          type: string
        Status:
          description: >-
            Status is the HTTP status code ([RFC7231], Section 6) generated by
            the origin server for this occurrence of the problem.
          type: integer
          format: int32
        Title:
          description: >-
            Title is a short, human-readable summary of the problem type. It
            SHOULD NOT change from occurrence to occurrence of the problem,
            except for purposes of localization (e.g., using proactive content
            negotiation; see [RFC7231], Section 3.4)
          type: string
        Type:
          description: >-
            Type is a URI reference [RFC3986] that identifies the problem type.
            This specification encourages that, when dereferenced, provides
            human-readable documentation for the problem type (e.g., using HTML
            [W3C.REC-html5-20141028]). When this member is not present, its
            value is assumed to be blank
          type: string
          enum:
            - Authorization Error
            - Backup Master Key Rejected
            - Conflict
            - Method Not Allowed
            - Object Not Found
            - Operation Error
            - Permission Error
            - Third Party Service Error
            - Third Party Service Timeout
            - Third Party Service Unavailable
            - Unknown Error
            - Validation Error
