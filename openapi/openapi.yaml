      additionalProperties: false
      required:
        - MasterKey
        - CAIP2
        - Account
      properties:
        MasterKey:
          type: string
          description: Master key name.
        CAIP2:
          type: string
          description: Chain identifier in CAIP-2 format (e.g., eip155:1, eip155:17000).
        Account:
          type: string
          description: Account name.
        Index:
          type: integer
          description: Address index. Default 0.
          default: 0
    cwpGetAddressResponse:
      type: object
      additionalProperties: false
