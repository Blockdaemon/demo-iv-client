  /api/assets/{caip19}/validators:
    get:
      tags:
        - Assets
      summary: Get a Validators for a Single Asset
      description: Retrieve details of all validators for an asset.
      operationId: getSummaryOfAssetsValidators
      parameters:
        - schema:
            type: string
          description: CAIP-19 asset identifier
          name: caip19
          in: path
          required: true
        - schema:
            type: boolean
          description: If set, do not use cache
          name: no_cache
          in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorDetailsForAssetDto'
        '400':
          description: Bad Request
          content:
            application/json:
