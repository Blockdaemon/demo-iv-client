  /api/assets/{caip19}:
    get:
      deprecated: true
      tags:
        - Assets
      summary: Get a Single Asset
      description: >-
        Retrieve details of a single asset including the vaults, under which the
        asset is present. If the exclude_empty parameter is also set, only
        Assets with currency will be returned.
      operationId: getAssetDetails
      parameters:
        - schema:
            $ref: '#/components/schemas/CAIP19'
          description: CAIP19 identifier of the asset
          name: caip19
          in: path
          required: true
        - schema:
            type: string
          description: If set, only Assets with currency will be returned
          name: exclude_empty
          in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssetResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
