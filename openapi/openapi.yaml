  /api/groups:
    get:
      tags:
        - Groups
      summary: Get a List of Groups
      description: >-
        Retrieves all groups. If no sorting parameters are given, the default
        sorting is ascending by name.
      operationId: getAllGroups
      parameters:
        - schema:
            enum:
              - crypto
              - date
            type: string
          description: Choose what to order by
          name: order_by
          in: query
        - schema:
            enum:
              - ASC
              - DESC
            type: string
          description: Choose direction of order
          name: order_direction
          in: query
      responses:
        '200':
          description: OK
