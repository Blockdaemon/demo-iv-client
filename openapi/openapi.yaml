    cwpTokenMetadata:
      type: object
      additionalProperties: false
      required:
        - CAIP19
      properties:
        CAIP19:
          type: string
          description: Asset identifier in CAIP-19 format (e.g. `eip155:1/erc20:0x...`).
        Symbol:
          type: string
          description: Symbol of the asset. Omitted if it could not be determined.
        Decimals:
          type: integer
          description: >-
            Number of decimals of the asset. Omitted if it could not be
            determined.
    cwpResolveAddressResponse:
      type: object
      additionalProperties: false
      required:
        - MasterKey
        - Account
        - Index
      properties:
        MasterKey:
          type: string
          description: Master key name.
        Account:
          type: string
          description: Account name.
        Index:
          type: integer
          description: Address index within the account.
    cwpSolanaAccountInfoRequest:
      description: >-
        Authority account for nonce lookup: either a literal on-chain address or
        master key + account + address index.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - CAIP2
            - Address
          properties:
            CAIP2:
              type: string
              description: >-
                Solana chain identifier in CAIP-2 form (e.g.
                `solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp`).
            Address:
              type: object
              additionalProperties: false
              required:
                - Address
              properties:
                Address:
                  type: string
                  description: Literal on-chain authority account address.
        - type: object
          additionalProperties: false
          required:
            - CAIP2
            - Address
          properties:
            CAIP2:
              type: string
            Address:
              type: object
              additionalProperties: false
              required:
                - MasterKeyName
                - AccountName
                - AddressIndex
              properties:
                MasterKeyName:
                  type: string
                AccountName:
                  type: string
                AddressIndex:
                  type: integer
                  description: Sub-address index; use `0` for the main address.
    cwpSolanaAccountInfo:
      type: object
      additionalProperties: false
      description: Response body; only field is the nonce account count.
      required:
        - NonceAccounts
      properties:
        NonceAccounts:
          type: integer
          description: >-
            Count of nonce accounts for the authority account on the requested
            chain.
    cwpAssetInfoFilter:
      type: object
      description: >-
        Filter for asset info search. All fields are optional. An empty object
        returns all assets.
      additionalProperties: false
      properties:
        CAIP2:
          type: string
          description: Chain ID according to CAIP-2 (e.g. "eip155:1").
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type:
            - boolean
            - 'null'
          description: >-
            If `true` or `false`, restrict to that testnet/mainnet flag. Omit
            the field or send JSON `null` to apply no testnet filter.
    cwpAssetInfo:
      type: object
      additionalProperties: false
      description: >-
        Asset information for a registered token. Search results include only
        these fields (use `CAIP2` on
        [`AssetInfoFilter`](#/components/schemas/AssetInfoFilter) to filter by
        chain, not as a response field).
      required:
        - ChainName
        - CAIP19
        - Symbol
        - TestNetwork
      properties:
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type: boolean
          description: Whether the chain is a test network.
    cwpCreateGroupRequest:
      type: object
      description: Request body for creating a group.
      additionalProperties: false
      required:
        - Name
      properties:
        Name:
          type: string
          description: Unique name for the group.
    cwpRegisterKnownChainRequest:
      type: object
      description: Request to register a chain from the built-in chain registry.
      additionalProperties: false
      required:
        - CAIP2
      properties:
        CAIP2:
          type: string
          description: CAIP-2 chain identifier (e.g. "eip155:1" for Ethereum mainnet).
    cwpAccount:
      type: object
      additionalProperties: false
      description: An account row returned by `GET /accounts/list`.
      required:
        - Name
        - MasterKey
        - IsExternal
      properties:
        Name:
          type: string
          description: Account name.
        MasterKey:
          type: string
          description: Name of the master key the account belongs to.
        IsExternal:
          type: boolean
          description: >-
            Whether the master key was generated externally rather than by this
            system.
    cwpChain:
      type: object
      additionalProperties: false
      description: A registered chain row returned by `GET /chains/list`.
      required:
        - ChainName
        - TestNet
        - CAIP2
      properties:
        ChainName:
          type: string
          description: Canonical name of the chain.
        TestNet:
          type: boolean
          description: Whether this is a test network.
        CAIP2:
          type: string
          description: CAIP-2 chain identifier.
    cwpToken:
      type: object
      additionalProperties: false
      description: A registered token row returned by `GET /tokens/list`.
      required:
        - ChainName
        - Testnet
        - Symbol
        - Decimals
        - CAIP2
        - CAIP19
      properties:
        ChainName:
          type: string
        Testnet:
          type: boolean
          description: Whether the chain is a test network.
        Symbol:
          type: string
        Decimals:
          type: integer
        CAIP2:
          type: string
        CAIP19:
          type: string
    cwpOperationFilter:
      type: object
      description: >-
        Filter for operation search and operation summary search. All fields are
        optional. Omitting `Statuses` restricts results to operations not in
        `Succeeded` or `Failed`. `OperationTypes` entries are operation type
        strings; see
        [`OperationTypesResponse`](#/components/schemas/OperationTypesResponse)
        and `GET /restrictions/optypes/*`.
      additionalProperties: false
      properties:
        OperationIDs:
          type: array
          description: If non-empty, only intents for these operation IDs.
          items:
            type: string
        OperationTypes:
          type: array
          description: >-
            Filter by stored intent `OperationType` values (human-readable
            strings, not URL path segments).
          items:
            $ref: '#/components/schemas/cwpOperationTypeName'
        Statuses:
          type: array
          description: >-
            If non-empty, only operations whose status matches one of these
            values.
          items:
            $ref: '#/components/schemas/cwpStatus'
    cwpPagination:
      type: object
      description: >-
        Cursor pagination for [`POST
        /operations/searchInfos`](#/paths/~1operations~1searchInfos/post).
      additionalProperties: false
      properties:
        Size:
          type: integer
          minimum: 0
          description: >-
            Maximum number of items to return. Omit or `0` to return all matches
            in one response (no continuation token).
        Token:
          type: string
          description: >-
            Opaque continuation token from the previous response's
            `PaginationToken`. Omit or empty for the first page. Must be a value
            previously returned by the server; behaviour otherwise unspecified.
    cwpOperationInfo:
      type: object
      additionalProperties: false
      description: Summary row for an operation (no intent body).
      required:
        - OperationID
        - OperationType
        - Status
        - CreatedTime
      properties:
        OperationID:
          type: string
        OperationType:
          $ref: '#/components/schemas/cwpOperationTypeName'
        Status:
          $ref: '#/components/schemas/cwpStatus'
        InitiatorID:
          type: string
          description: User id of the initiator; omitted in JSON when empty.
        CreatedTime:
          type: string
          format: date-time
          description: >-
            Time the operation record was created (RFC 3339). List APIs sort by
            this field descending.
        ErrorCode:
          type: string
          description: Machine-readable error code; present only when Status is Failed.
    cwpSearchOperationInfosRequest:
      type: object
      additionalProperties: false
      properties:
        Filter:
          $ref: '#/components/schemas/cwpOperationFilter'
        Pagination:
          $ref: '#/components/schemas/cwpPagination'
    cwpSearchOperationInfosResponse:
      type: object
      additionalProperties: false
      required:
        - Infos
        - PaginationToken
      properties:
        Infos:
          type: array
          items:
            $ref: '#/components/schemas/cwpOperationInfo'
        PaginationToken:
          type: string
          description: >-
            Pass as `Pagination.Token` to fetch the next page. Empty when there
            are no more results, or when no page size limit was used.
    cwpListOperationsResult:
      type: object
      description: >-
        Result of [`POST
        /operations/search`](#/paths/~1operations~1search/post). `Intents` holds
        full stored intent objects as JSON (see
        [`IntentItem`](#/components/schemas/IntentItem)).
      additionalProperties: false
      required:
        - Intents
      properties:
        Intents:
          type: array
          description: >-
            Stored operation intents, each a JSON object matching one
            `IntentItem` variant.
          items:
            $ref: '#/components/schemas/cwpIntentItem'
    cwpAddressSpec:
      type: object
      additionalProperties: false
      description: >-
        Identifies an on-chain address in transaction intents and related APIs.
        Either set both `MasterKeyName` and `AccountName` (with optional
        `AddressIndex` where the API allows it; index `0` is the main address
        when deriving), or set `Address` to a literal address string. Setting
        only one of `MasterKeyName` or `AccountName` is invalid. For [`POST
        /solana/accountInfo`](#/paths/~1solana~1accountInfo/post), when not
        sending `Address`, `AddressIndex` is required alongside master key and
        account.
      anyOf:
        - required:
            - MasterKeyName
            - AccountName
        - required:
            - Address
      properties:
        MasterKeyName:
          type: string
          description: >-
            Master key name; must be paired with `AccountName` when not using
            `Address` alone.
        AccountName:
          type: string
          description: >-
            Account name; must be paired with `MasterKeyName` when not using
            `Address` alone.
        AddressIndex:
          type: integer
          description: Sub-address index within the account; `0` is the main address.
        Address:
          type: string
          description: >-
            Literal blockchain address, or used with derivation fields when
            resolving a registered address.
    cwpTxOutputSearch:
      type: object
      description: >-
        Transaction output amount plus the fields of
        [`AddressSpec`](#/components/schemas/AddressSpec) for the destination.
      additionalProperties: false
      unevaluatedProperties: false
      required:
        - Amount
      anyOf:
        - required:
            - MasterKeyName
            - AccountName
        - required:
            - Address
      properties:
        MasterKeyName:
          type: string
          description: >-
            Master key name; must be paired with `AccountName` when not using
            `Address` alone.
        AccountName:
          type: string
          description: >-
            Account name; must be paired with `MasterKeyName` when not using
            `Address` alone.
        AddressIndex:
          type: integer
          description: Sub-address index within the account; `0` is the main address.
        Address:
          type: string
          description: >-
            Literal blockchain address, or used with derivation fields when
            resolving a registered address.
        Amount:
          type: string
          description: Amount for this output (required).
    cwpAddressIndexAmountSearch:
      type: object
      additionalProperties: false
      required:
        - Index
        - Amount
      description: Sub-address index with an amount (e.g. funding sub-addresses).
      properties:
        Index:
          type: integer
          description: Index of the sub-address; resolved to a concrete on-chain address.
        Amount:
          type: string
          description: Amount associated with that sub-address.
    cwpSubAddressDataSearch:
      type: object
      additionalProperties: false
      description: >-
        One asset and sub-address row when consolidating from multiple
        sub-addresses.
      properties:
        Asset:
          type: string
          description: Asset symbol for this consolidation row.
        Amount:
          type: string
          description: Amount for this sub-address.
        SubAddressIndex:
          type: integer
          description: Index of the sub-address within the account.
    cwpExternalPairingMessageSearch:
      type: object
      additionalProperties: false
      description: Single pairing message when attaching an external master key.
      properties:
        Value:
          type: string
          format: byte
          description: Raw pairing message bytes (base64 in JSON).
    cwpPartialSignaturesSearch:
      type: object
      additionalProperties: false
      description: Partial signatures for one transaction inside a signing batch.
      properties:
        SignaturesForTx:
          type: array
          description: >-
            Partial signature blobs for one transaction (each entry is
            base64-encoded bytes).
          items:
            type: array
            items:
              type: string
              format: byte
    cwpRateUpdateSearch:
      type: object
      additionalProperties: false
      description: USD spot rate or min/max bounds for one asset in a rate update.
      properties:
        Asset:
          type: string
          description: Asset identifier (required).
        USDRate:
          type: number
          format: double
          description: Fixed USD rate; cannot be combined with min or max bounds.
        USDMin:
          type: number
          format: double
          description: Minimum allowed USD rate; cannot be combined with `USDRate`.
        USDMax:
          type: number
          format: double
          description: >-
            Maximum allowed USD rate; must be ≥ `USDMin` when used; cannot be
            combined with `USDRate`.
      required:
        - Asset
