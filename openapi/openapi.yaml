    cwpAllocationIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Asset:
          type: string
        TestNetwork:
          type: boolean
        Source:
          type: string
        MasterKeyName:
          type: string
        DestinationType:
          type: string
          enum:
            - internal
            - external
        DestinationAmounts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/cwpDestinationAmount'
        ExecutorID:
          $ref: '#/components/schemas/cwpAddressSpec'
        AllocationDeadline:
          type: string
          format: date-time
        SettlementDeadline:
          type: string
          format: date-time
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
      required:
        - Asset
        - Source
        - MasterKeyName
        - DestinationType
        - DestinationAmounts
        - ExecutorID
        - SettlementDeadline
      description: Creates a Canton allocation (settlement workflow).
    cwpAllocationStartRequest:
      description: >-
        Composes `AllocationIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`). Enforces
        `ChainParametersAtMostOne`.
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpAllocationIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
        - $ref: '#/components/schemas/cwpChainParametersAtMostOne'
    cwpCantonEnrollmentIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Asset:
          type: string
        TestNetwork:
          type: boolean
        Source:
          $ref: '#/components/schemas/cwpAddressSpec'
      required:
        - Asset
        - Source
      description: Enrolls an external party on the Canton ledger.
    cwpCantonEnrollmentStartRequest:
      description: >-
        Composes `CantonEnrollmentIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpCantonEnrollmentIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpCantonPreapprovalIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Asset:
          type: string
        TestNetwork:
          type: boolean
        Source:
          $ref: '#/components/schemas/cwpAddressSpec'
      required:
        - Asset
        - Source
      description: Creates a transfer preapproval for a Canton party.
    cwpCantonPreapprovalStartRequest:
      description: >-
        Composes `CantonPreapprovalIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpCantonPreapprovalIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpEndInvestorOnboardingOfferIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Asset:
          type: string
        TestNetwork:
          type: boolean
        Source:
          type: string
          description: Source account name.
        MasterKeyName:
          type: string
        EndInvestorOnboardingOfferCID:
          type: string
          description: Contract ID of the end-investor-onboarding offer.
        OnboardingOfferChoice:
          type: string
          description: Choice to exercise on the offer.
        RejectReason:
          type: string
          description: Rejection reason when applicable.
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
      required:
        - Asset
        - Source
        - MasterKeyName
        - EndInvestorOnboardingOfferCID
        - OnboardingOfferChoice
      description: >-
        Exercises a choice on a Canton end-investor-onboarding offer.
        Blockchain-specific options use the same union as other intents: at most
        one of `EVM`, `Bitcoin`, `Substrate`, `Solana`, `Canton`, `Stellar`, or
        `TVM` may be set (see `ChainParametersAtMostOne`).
    cwpEndInvestorOnboardingOfferStartRequest:
      description: >-
        Composes `EndInvestorOnboardingOfferIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`). Enforces
        `ChainParametersAtMostOne`.
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpEndInvestorOnboardingOfferIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
        - $ref: '#/components/schemas/cwpChainParametersAtMostOne'
    cwpTransactionIntentEnrichment:
      type: object
      description: Additional transaction intent fields.
      additionalProperties: false
      properties:
        DecodedRawTransaction:
          type: string
          readOnly: true
          description: Decoded raw transaction.
        Function:
          $ref: '#/components/schemas/cwpTransactionFunctionSpec'
          readOnly: true
    CwpWalletConnectPairParams:
      type: object
      description: Parameters for initiating a WalletConnect pairing.
      additionalProperties: false
      required:
        - uri
        - masterKeyName
        - accountName
      properties:
        uri:
          type: string
          description: WalletConnect pairing URI from the dApp (starts with "wc:").
        masterKeyName:
          type: string
          description: Master key name to use for signing.
        accountName:
          type: string
          description: Account name to use for signing.
        initiatorUserID:
          type: string
          description: Optional user ID of the initiator. Used for policy evaluation.
    CwpWalletConnectDisconnectParams:
      type: object
      description: Parameters for disconnecting a WalletConnect session.
      additionalProperties: false
      required:
        - topic
      properties:
        topic:
          type: string
          description: Session or pairing topic to disconnect.
    CwpWalletConnectListSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/CwpWalletConnectSessionInfo'
    CwpWalletConnectSessionInfo:
      type: object
      description: Summary of an active WalletConnect session.
      required:
        - topic
        - peerMetadata
        - expiry
        - accounts
      properties:
        topic:
          type: string
          description: Session topic identifier.
        peerMetadata:
          $ref: '#/components/schemas/CwpWalletConnectPeerMetadata'
        expiry:
          type: integer
          format: int64
          description: Session expiry as a Unix timestamp.
        accounts:
          type: array
          description: CAIP-10 account identifiers approved for this session.
          items:
            type: string
    CwpWalletConnectPeerMetadata:
      type: object
      description: Metadata of the connected dApp.
      properties:
        name:
          type: string
          description: Human-readable name of the dApp.
        description:
          type: string
          description: Short description of the dApp.
        url:
          type: string
          description: Homepage URL of the dApp.
        icons:
          type: array
          description: Icon URLs for the dApp.
          items:
            type: string
        verifyUrl:
          type: string
          description: >-
            WalletConnect Verify API server URL used for domain verification and
            anti-phishing.
    CwpWalletConnectErrorResponse:
      type: object
      required:
        - message
      properties:
        errorCode:
          type: string
          description: MPA error code (M-prefixed). Only for MPA system errors.
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Additional error data. Only for MPA system errors.
  parameters:
    cwpoperationID:
      name: operationID
      in: path
      required: true
      description: Operation identifier.
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{1,96}$
  responses:
    cwpBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpNotFound:
      description: Unknown operation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpInternalError:
      description: >-
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data` from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    CwpWalletConnectBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectNotFound:
      description: Resource not found (session or tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectInternalError:
      description: >
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data`

        from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
