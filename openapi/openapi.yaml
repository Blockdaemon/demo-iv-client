      properties:
        Address:
          type: string
          description: The blockchain address.
    cwpResolveAddressRequest:
      type: object
      additionalProperties: false
      required:
        - Address
      properties:
        Address:
          type: string
          description: The blockchain address to resolve.
    cwpBalanceRequest:
      type: object
      description: Request to get a balance for a master key, account, and asset.
      additionalProperties: false
      required:
        - MasterKey
        - Account
        - CAIP19
      properties:
        MasterKey:
          type: string
          description: Master key name.
        Account:
          type: string
          description: Account name.
        CAIP19:
          type: string
          description: Asset identifier in CAIP-19 format (e.g. `eip155:1/slip44:60`).
    cwpTokenBalance:
      type: object
      additionalProperties: false
      required:
        - CAIP19
        - Symbol
        - ChainName
        - Amount
      properties:
        CAIP19:
          type: string
          description: Asset identifier in CAIP-19 format (e.g. `eip155:1/slip44:60`).
        Symbol:
          type: string
          description: Token symbol (e.g. `ETH`, `BTC`).
        ChainName:
          type: string
          description: Human-readable chain name (e.g. `Ethereum`, `Bitcoin`).
        Amount:
          type: string
          description: >-
            The balance as a major-unit decimal string (e.g. `"0.25"`). An empty
            string means the balance could not be retrieved for this token.
    cwpTokenBalancesForAccountRequest:
      type: object
      additionalProperties: false
      required:
        - MasterKey
