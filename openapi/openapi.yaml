    cwpEVMSpec:
      type: object
      additionalProperties: false
      description: Optional EVM-specific parameters.
      properties:
        Gas:
          type: string
          description: Gas limit (wei).
        MaxPriorityFeePerGas:
          type: string
          description: Max priority fee per gas (wei).
        MaxFeePerGas:
          type: string
          description: Max fee per gas (wei).
        Nonce:
          type: string
          description: Transaction nonce.
        Data:
          type: string
          description: Hex-encoded call data.
        EIP7702Authorizations:
          type: array
          items:
            type: string
            format: byte
    cwpBitcoinSpec:
      type: object
      additionalProperties: false
      description: Optional Bitcoin-specific parameters.
      properties:
        FeePerVByte:
          type: integer
          description: Fee per virtual byte (satoshis).
        UTXOInclude:
          type: array
          items:
            type: object
            properties:
              TxID:
                type: string
              Index:
                type: integer
          description: UTXOs that must be included.
        UTXOExclude:
          type: array
          items:
            type: object
            properties:
              TxID:
                type: string
              Index:
                type: integer
          description: UTXOs that must be excluded.
    cwpSubstrateSpec:
      type: object
      additionalProperties: false
      description: Optional Substrate-specific parameters.
      properties:
        Tip:
          type: string
          description: Extra tip (lowest denomination).
        Nonce:
          type: string
          description: Transaction nonce.
    cwpSolanaSpec:
      type: object
      additionalProperties: false
      description: Optional Solana-specific parameters.
      properties:
        PriorityFee:
          type: integer
          description: Priority fee (micro-lamports per compute unit).
        AssociateTokenAccount:
          type: object
          properties:
            MintAddress:
              type: string
        AssociateNonceAccount:
          type: object
          description: Parameters for associating a nonce account.
          properties:
            PayerAddress:
              type: string
            NonceAccount:
              type: string
            Authority:
              type: string
            Start:
              type: integer
              description: Index of the first nonce account to associate.
            Count:
              type: integer
              description: Number of nonce accounts to associate.
        SPLTokenTransfer:
          type: object
          properties:
            amount:
              type: string
            authority:
              type: string
            mintAddress:
              type: string
            decimals:
              type: integer
        NonceAccount:
          type: object
          properties:
            NonceAccount:
              type: string
    cwpCantonSpec:
      type: object
      additionalProperties: false
      description: Optional Canton-specific parameters.
      properties:
        Reason:
          type: string
        Allocation:
          type: object
          properties:
            SettlementExecutorID:
              type: object
              description: >-
                Executor party as master key / account / address (see
                AddressSpec).
              properties:
                MasterKeyName:
                  type: string
                AccountName:
                  type: string
                AddressIndex:
                  type: integer
                Address:
                  type: string
            AllocationDeadline:
              type: string
              format: date-time
            SettlementDeadline:
              type: string
              format: date-time
        AllocationChoice:
          type: object
          properties:
            ContractID:
              type: string
            Choice:
              type: string
        InvokeTokenChoice:
          type: object
          properties:
            ContractID:
              type: string
            Choice:
              type: string
        RequestTokenChoice:
          type: object
          properties:
            Choice:
              type: string
            Amount:
              type: string
            Holder:
              type: string
            TransferOfferCIDs:
              type: array
              items:
                type: string
            AllocationCIDs:
              type: array
              items:
                type: string
        TokenInformation:
          type: object
          properties:
            InstrumentAdmin:
              type: string
            InstrumentID:
              type: string
        Enrollment:
          type: object
          properties:
            PartyID:
              type: string
            PublicKey:
              type: string
              description: >-
                Hex-encoded raw Ed25519 public key bytes for topology
                transactions.
        Preapproval:
          type: object
          properties:
            PartyID:
              type: string
            DSOID:
              type: string
        UseTransferCommand:
          type: boolean
          description: >-
            When true, use the TransferCommand cold-transfer path instead of the
            round-dependent TransferFactory.
        TransferCommand:
          type: object
          properties:
            DelegatePartyID:
              type: string
            ExpiresAt:
              type: string
              format: date-time
            Nonce:
              type: integer
              format: int64
        Clawback:
          type: object
          properties:
            InstrumentConfiguration:
              type: string
            ReceiverDelegationCID:
              type:
                - string
                - 'null'
            ClawbackAmount:
              type: string
            InputHoldingCIDs:
              type: array
              items:
                type: string
        FreezePositions:
          type: object
          properties:
            RegistrarServiceCID:
              type: string
            CredentialCIDs:
              type: array
              items:
                type: string
            DenyListCIDs:
              type: array
              items:
                type: string
            FreezeID:
              type: string
            Reason:
              type: string
            InstrumentConfigurationCID:
              type: string
        UnfreezePositions:
          type: object
          properties:
            RegistrarServiceCID:
              type: string
            CredentialCIDs:
              type: array
              items:
                type: string
            DenyListCIDs:
              type: array
              items:
                type: string
            InstrumentConfigurationCID:
              type: string
        PauseInstrument:
          type: object
          properties:
            InstrumentConfigurationCID:
              type: string
        UnpauseInstrument:
          type: object
          properties:
            InstrumentConfigurationCID:
              type: string
        EndInvestorOnboardingOffer:
          type: object
          description: >-
            Parameters for exercising a choice on a Canton
            end-investor-onboarding offer (`EndInvestorOnboardingOfferSpec` in
            cwpapi).
          properties:
            EndInvestorOnboardingOfferCID:
              type: string
            EndInvestorOnboardingOfferChoice:
              type: string
            RejectReason:
              type: string
    cwpStellarSpec:
      type: object
      additionalProperties: false
      description: Optional Stellar-specific parameters.
      properties:
        Fee:
          type: integer
        Memo:
          type: object
          properties:
            type:
              type: string
            value:
              type: string
        ActivateAddress:
          type: object
          properties:
            destinationAddress:
              type: string
            amount:
              type: string
    cwpTVMSpec:
      type: object
      description: Optional TVM-specific parameters.
    cwpChainParametersAtMostOne:
      type: object
      additionalProperties: false
      description: >-
        Blockchain-specific options for transaction intents. At most one of
        `EVM`, `Bitcoin`, `Substrate`, `Solana`, `Canton`, `Stellar`, or `TVM`
        may be set; the server rejects multiple families in one request.
      properties:
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
    cwpDestinationAmount:
      type: object
      description: >-
        A single transfer destination with amount. Use Destination for vault
        name (internal) or address (external). MasterKeyName is required for
        internal transfers.
      additionalProperties: false
      required:
        - Destination
        - Amount
      properties:
        Destination:
          type: string
          description: Recipient vault name (internal) or blockchain address (external).
        MasterKeyName:
          type: string
          description: >-
            Master key name for internal destination. Ignored for external
            transfers.
        Amount:
          type: string
          description: Amount to transfer.
    cwpStartOperationResponse:
      type: object
      additionalProperties: false
      required:
        - OperationID
      properties:
        OperationID:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,96}$
    cwpOperationStatus:
      type: object
      additionalProperties: false
      required:
        - Status
      properties:
        Status:
          $ref: '#/components/schemas/cwpStatus'
        ErrorDetails:
          $ref: '#/components/schemas/cwpErrorDetails'
        Result:
          $ref: '#/components/schemas/cwpResult'
    cwpOperationTypeName:
      type: string
      description: Operation type.
      enum:
        - add ERC20 asset
        - add SPL token
        - add canton token
        - register token
        - unregister token
        - delete token
        - associate to SPL token
        - associate to nonce account
        - activate stellar address
        - get address
        - backup master key
        - create master key
        - create account
        - transfer
        - stake
        - unstake
        - register user
        - set user public key
        - delete user
        - reset user
        - update group
        - rename group
        - update rates
        - attach master key
        - create batch
        - finish current batch
        - delete current batch
        - call smart contract
        - deploy smart contract
        - generic signing
        - consolidate funds
        - fund subaddresses
        - register custom chain
        - unregister chain
        - register blockchain network
        - unregister blockchain network
        - set ers public key
        - make transaction
        - sponsor
        - generate consolidation data
        - sign raw transaction
        - create allocation
        - canton enrollment
        - canton preapproval
        - call choice on end investor onboarding offer
        - update transaction restriction
        - update config restriction
        - update policy restriction
    cwpStatus:
      type: string
      enum:
        - Pending initialization
        - Pending confirmation
        - Pending approval
        - Pending execution
        - Executing
        - Pending signature
        - Failed
        - Succeeded
    cwpErrorDetails:
      type: object
      description: Present when Status is Failed.
      required:
        - Status
        - ErrorCode
      properties:
        Status:
          $ref: '#/components/schemas/cwpStatus'
        ErrorCode:
          type: string
          examples:
            - M0001
        Properties:
          type: object
          additionalProperties: true
        Timestamp:
          type: string
          format: date-time
    cwpResult:
      type: object
      additionalProperties: false
      description: >-
        Present when Status is Succeeded. Populated fields depend on operation
        type.
      properties:
        Backup:
          type: array
          description: Present for the Backup master key operation.
          items:
            $ref: '#/components/schemas/cwpKeyBackup'
        ReceiveAddress:
          $ref: '#/components/schemas/cwpAddress'
          description: >-
            Present for Get address (deprecated) and Canton enrollment
            operations.
        Transaction:
          $ref: '#/components/schemas/cwpTransaction'
          description: >-
            Present for transaction-creating operations: Transfer, Make
            transaction, Stake, Unstake, Allocation, Create account, Associate
            to SPL token, Associate nonce account, Activate stellar address,
            Call contract, Deploy contract, Consolidate funds, Fund
            subaddresses, Sign raw transaction, Canton preapproval, and Finish
            current batch (when the batch contains transaction operations).
        TransactionBatch:
          type: array
          description: Present for Create batch operation.
          items:
            type: string
            format: byte
        GenericSignature:
          $ref: '#/components/schemas/cwpSignedMessage'
          description: >-
            Present for Generic signing and Finish current batch (when batch
            contains signing operations).
        ConsolidationData:
          $ref: '#/components/schemas/cwpConsolidationData'
          description: Present for Generate consolidation data operation.
    cwpKeyBackup:
      type: object
      additionalProperties: false
      required:
        - Type
        - Backup
      properties:
        Type:
          type: string
          enum:
            - ECDSA_SECP256K1
            - EdDSA_Ed25519
        Backup:
          type: string
          format: byte
    cwpAddress:
      type: object
      additionalProperties: false
      required:
        - Encoding
        - Index
      properties:
        Encoding:
          type: string
        Index:
          type: integer
    cwpTransaction:
      type: object
      additionalProperties: false
      properties:
        ID:
          type: string
        CantonContractID:
          type: string
        SignedTransaction:
          type: string
        Fee:
          type: string
          deprecated: true
        SenderAddresses:
          type: array
          deprecated: true
          items:
            $ref: '#/components/schemas/cwpAddress'
        BlockChainTransaction:
          type: string
          format: byte
          deprecated: true
    cwpSignedMessage:
      type: object
      additionalProperties: false
      properties:
        Signature:
          type: string
          format: byte
        Message:
          type: string
    cwpConsolidationData:
      type: object
      additionalProperties: false
      required:
        - Data
      properties:
        Data:
          type: string
          description: Hex-encoded method call data
        EIP7702Authorizations:
          type: array
          items:
            type: string
            format: byte
        EIP7702AuthorizationsForReset:
          type: array
          items:
            type: string
            format: byte
    cwpOperationApprovalStatus:
      type: object
      additionalProperties: false
      properties:
        ApprovedBy:
          type: array
          items:
            type: string
        RejectedBy:
          type: array
          items:
            type: string
        PendingApprovals:
          type: array
          description: Empty if RejectedBy is non-empty.
          items:
            type: string
    cwpApproversByGroups:
      type: object
      additionalProperties: false
      description: Groups and the number of approvers required across all listed groups.
      required:
        - Groups
        - RequiredApprovers
      properties:
        Groups:
          type: array
          description: >-
            Groups from which approvals are requested. At least one group must
            be specified.
          minItems: 1
          items:
            type: string
        RequiredApprovers:
          type: integer
          description: Number of approvers required in total across all groups.
          minimum: 1
    cwpConfigRestriction:
      type: object
      additionalProperties: false
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required when the restriction applies.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
    cwpPolicyRestriction:
      type: object
      additionalProperties: false
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required when the restriction applies.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
    cwpOperationTypesResponse:
      type: array
      description: >-
        List of operation type strings. Same values as elsewhere in this API;
        see `GET /restrictions/optypes/*` for category-specific subsets.
      items:
        type: string
    cwpTransactionFunctionNamesResponse:
      type: array
      description: List of names for filtering transactions by function.
      items:
        type: string
    cwpTransactionRestriction:
      type: object
      additionalProperties: false
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required when the restriction applies.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
        Amount:
          $ref: '#/components/schemas/cwpAmountCriterion'
        Fee:
          $ref: '#/components/schemas/cwpAmountCriterion'
        Symbol:
          $ref: '#/components/schemas/cwpValueCriterionString'
        Source:
          $ref: '#/components/schemas/cwpValueCriterionSource'
        Destination:
          $ref: '#/components/schemas/cwpValueCriterionDestination'
        ExternalDestination:
          description: >-
            A non-null empty ExternalDestination criterion is satisfied for any
            external destination.
          allOf:
            - $ref: '#/components/schemas/cwpValueCriterionString'
        TransactionFunction:
          $ref: '#/components/schemas/cwpValueCriterionTransactionFunction'
        TestNetwork:
          type: boolean
    cwpValueCriterionString:
      type: object
      additionalProperties: false
      description: >-
        Satisfied if the input value matches the Only or Except list. At most
        one of Only or Except can be non-empty. The Only list is satisfied if
        the input matches any listed value. The Except list is satisfied if the
        input matches none of the listed values (denylist). If both lists are
        empty, the criterion is satisfied for any value.
      properties:
        Only:
          type: array
          description: Satisfied if the input matches any listed value.
          items:
            type: string
        Except:
          type: array
          description: Satisfied if the input matches none of the listed values.
          items:
            type: string
    cwpValueCriterionSource:
      type: object
      additionalProperties: false
      description: >-
        Satisfied if the input value matches the Only or Except list. At most
        one of Only or Except can be non-empty. The Only list is satisfied if
        the input matches any listed value. The Except list is satisfied if the
        input matches none of the listed values (denylist). If both lists are
        empty, the criterion is satisfied for any value.
      properties:
        Only:
          type: array
          description: Satisfied if the input matches any listed value.
          items:
            $ref: '#/components/schemas/cwpSource'
        Except:
          type: array
          description: Satisfied if the input matches none of the listed values.
          items:
            $ref: '#/components/schemas/cwpSource'
    cwpValueCriterionDestination:
      type: object
      additionalProperties: false
      description: >-
        Satisfied if the input value matches the Only or Except list. At most
        one of Only or Except can be non-empty. The Only list is satisfied if
        the input matches any listed value. The Except list is satisfied if the
        input matches none of the listed values (denylist). If both lists are
        empty, the criterion is satisfied for any value.
      properties:
        Only:
          type: array
          description: Satisfied if the input matches any listed value.
          items:
            $ref: '#/components/schemas/cwpDestination'
        Except:
          type: array
          description: Satisfied if the input matches none of the listed values.
          items:
            $ref: '#/components/schemas/cwpDestination'
    cwpValueCriterionTransactionFunction:
      type: object
      additionalProperties: false
      description: >-
        Satisfied if the transaction function matches the Only or Except list.
        At most one of Only or Except can be non-empty. The Only list is
        satisfied if the input matches any listed value. The Except list is
        satisfied if the input matches none of the listed values (denylist). If
        both lists are empty, the criterion is satisfied for any value. Use
        function names from `GET /restrictions/functionNames`.
      properties:
        Only:
          type: array
          description: Satisfied if the input matches any listed value.
          items:
            type: string
        Except:
          type: array
          description: Satisfied if the input matches none of the listed values.
          items:
            type: string
    cwpAmountCriterion:
      type: object
      additionalProperties: false
      description: >-
        Satisfied if the transaction amount exceeds Above (after currency
        conversion). Currency is required when Above is non-zero.
      properties:
        Above:
          type: number
          format: double
          description: Criteria is satisfied if the amount exceeds this value.
        Currency:
          type: string
          description: Currency for Above.
    cwpSource:
      type: object
      additionalProperties: false
      description: Source is always internal and derived from master key and account.
      required:
        - MasterKeyName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal source.
        AccountName:
          type: string
          description: >-
            Account name of the internal source. If not specified, it matches
            any account for the master key.
    cwpDestination:
      type: object
      description: >-
        Destination is either internal (master key + account) or external
        (address).
      oneOf:
        - required:
            - Address
        - required:
            - MasterKeyName
            - AccountName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal destination.
        AccountName:
          type: string
          description: Account name of the internal destination.
        Address:
          type: string
          description: External destination address.
    cwpErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        errorCode:
          type: string
          description: MPA error code (M-prefixed). Only for MPA system errors.
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Additional error data. Only for MPA system errors.
    cwpStartOperationMetadata:
      type: object
      description: Optional metadata when starting an operation.
      additionalProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
    cwpStoredIntentMetadata:
      type: object
      description: Operation metadata.
      additionalProperties: false
      properties:
        InitiatorID:
          type: string
        InitiatorName:
          type: string
          readOnly: true
        OperationType:
          $ref: '#/components/schemas/cwpOperationTypeName'
          readOnly: true
        OperationID:
          type: string
        Timestamp:
          type: string
          format: date-time
          readOnly: true
    cwpRegisterTokenIntentPayload:
      type: object
      additionalProperties: false
      properties:
        CAIP19:
          type: string
        Symbol:
          type: string
        Decimals:
          type: integer
      required:
        - CAIP19
        - Symbol
        - Decimals
      description: Registers a token by CAIP-19.
    cwpRegisterTokenStartRequest:
      description: >-
        Composes `RegisterTokenIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpRegisterTokenIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpRegisterCustomChainIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        TestNet:
          type: boolean
        CAIP19:
          type: string
        NativeAssetSymbol:
          type: string
        NativeAssetDecimals:
          type: integer
      required:
        - ChainName
        - CAIP19
        - NativeAssetSymbol
      description: >-
        Registers a custom chain and native asset; CAIP-2 is derived from
        CAIP-19.
    cwpRegisterCustomChainStartRequest:
      description: >-
        Composes `RegisterCustomChainIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpRegisterCustomChainIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpUnregisterTokenIntentPayload:
      type: object
      additionalProperties: false
      properties:
        CAIP19:
          type: string
          description: >-
            CAIP-19 identifier of the token to unregister (e.g.
            "eip155:1/erc20:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48").
      required:
        - CAIP19
      description: Removes a token previously registered via `registerToken`.
    cwpUnregisterTokenStartRequest:
      description: >-
        Composes `UnregisterTokenIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpUnregisterTokenIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpUnregisterChainIntentPayload:
      type: object
      additionalProperties: false
      properties:
        CAIP2:
          type: string
          description: CAIP-2 identifier of the chain to unregister (e.g. "eip155:1337").
      required:
        - CAIP2
      description: >-
        Removes a chain previously registered via `registerCustomChain`. Fails
        if non-native tokens are still registered on the chain.
    cwpUnregisterChainStartRequest:
      description: >-
        Composes `UnregisterChainIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpUnregisterChainIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpUpdateConfigRestrictionIntentPayload:
      type: object
      additionalProperties: false
      properties:
        Add:
          $ref: '#/components/schemas/cwpConfigRestriction'
        Delete:
          $ref: '#/components/schemas/cwpConfigRestriction'
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      description: Adds or removes config restrictions.
    cwpUpdateConfigRestrictionStartRequest:
      description: >-
        Composes `UpdateConfigRestrictionIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpUpdateConfigRestrictionIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpUpdatePolicyRestrictionIntentPayload:
      type: object
      additionalProperties: false
      properties:
        Add:
          $ref: '#/components/schemas/cwpPolicyRestriction'
        Delete:
          $ref: '#/components/schemas/cwpPolicyRestriction'
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      description: Adds or removes policy restrictions.
    cwpUpdatePolicyRestrictionStartRequest:
      description: >-
        Composes `UpdatePolicyRestrictionIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpUpdatePolicyRestrictionIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpUpdateTransactionRestrictionIntentPayload:
      type: object
      additionalProperties: false
      properties:
        Add:
          $ref: '#/components/schemas/cwpTransactionRestriction'
        Delete:
          $ref: '#/components/schemas/cwpTransactionRestriction'
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      description: Adds or removes transaction restrictions.
    cwpUpdateTransactionRestrictionStartRequest:
      description: >-
        Composes `UpdateTransactionRestrictionIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`).
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpUpdateTransactionRestrictionIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpTransactionIntentPayload:
      type: object
      description: >-
        Payload for `makeTransaction`. Structured path (`Destination`, optional
        chain specs): build, sign, and broadcast. Raw path (`RawTransaction`,
        optional `TxHash`): MPC sign only—no broadcast; integrator submits
        `SignedTransaction` from the completed operation.
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Asset:
          type: string
        TestNetwork:
          type: boolean
        Source:
          $ref: '#/components/schemas/cwpAddressSpec'
        Destination:
          type: array
          minItems: 1
          description: >-
            Required for structured transfers (omit when using
            `RawTransaction`).
          example:
            - Address: '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb0'
              Amount: '100.00'
          items:
            $ref: '#/components/schemas/cwpTxOutputSearch'
        RawTransaction:
          type: string
          description: >-
            Pre-built unsigned transaction bytes. When present, the operation
            performs MPC signing only and does not broadcast; use the completed
            operation's `SignedTransaction` to submit to the network.
        TxHash:
          type: string
          description: >-
            Optional hash for Canton prepared-submission signing when using
            `RawTransaction`.
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
      anyOf:
        - required:
            - Source
            - Destination
            - CAIP19
          not:
            required:
              - RawTransaction
        - required:
            - Source
            - RawTransaction
    cwpMakeTransactionStartRequest:
      type: object
      description: >-
        Composes `TransactionIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`). Uses OpenAPI
        3.1 `unevaluatedProperties` to merge metadata and payload. At most one
        of `EVM`, `Bitcoin`, `Substrate`, `Solana`, `Canton`, `Stellar`, or
        `TVM` may be set.
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpTransactionIntentPayload'
    cwpDeleteTokenIntentPayload:
      type: object
      additionalProperties: false
      properties:
        Symbol:
          type: string
        TestNetwork:
          type: boolean
        ChainName:
          type: string
        CAIP19:
          type: string
      required:
        - Symbol
      description: >-
        **Deprecated.** Legacy symbol-based payload for `deleteToken`. Prefer
        `UnregisterTokenIntentPayload` with required `CAIP19`.
      deprecated: true
    cwpDeleteTokenStartRequest:
      description: >-
        **Deprecated.** Prefer `UnregisterTokenStartRequest`. Composes
        `DeleteTokenIntentPayload` plus optional `StartOperationMetadata`
        (`OperationID`, `InitiatorID`).
      deprecated: true
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpDeleteTokenIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
    cwpAssociateToSPLTokenIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        SPLSymbol:
          type: string
        TestNetwork:
          type: boolean
        MasterKeyName:
          type: string
        Source:
          type: string
          description: Source account name.
        AddressIndex:
          type: integer
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
      required:
        - SPLSymbol
        - Source
      description: Associates a wallet account with an SPL token account.
    cwpAssociateToSPLTokenStartRequest:
      description: >-
        Composes `AssociateToSPLTokenIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`). Enforces
        `ChainParametersAtMostOne`.
      type: object
      unevaluatedProperties: false
      properties:
        OperationID:
          type: string
          description: Unique operation identifier.
        InitiatorID:
          type: string
          description: Initiator identifier.
      allOf:
        - $ref: '#/components/schemas/cwpAssociateToSPLTokenIntentPayload'
        - $ref: '#/components/schemas/cwpStartOperationMetadata'
        - $ref: '#/components/schemas/cwpChainParametersAtMostOne'
    cwpAssociateNonceAccountIntentPayload:
      type: object
      additionalProperties: false
      properties:
        ChainName:
          type: string
        CAIP19:
          type: string
        Symbol:
          type: string
        TestNetwork:
          type: boolean
        TotalNonceAccounts:
          type: integer
          description: >-
            Target number of nonce accounts to associate; if omitted, the server
            default applies.
        MasterKeyName:
          type: string
        Source:
          type: string
        Authority:
          $ref: '#/components/schemas/cwpAddressSpec'
        EVM:
          $ref: '#/components/schemas/cwpEVMSpec'
        Bitcoin:
          $ref: '#/components/schemas/cwpBitcoinSpec'
        Substrate:
          $ref: '#/components/schemas/cwpSubstrateSpec'
        Solana:
          $ref: '#/components/schemas/cwpSolanaSpec'
        Canton:
          $ref: '#/components/schemas/cwpCantonSpec'
        Stellar:
          $ref: '#/components/schemas/cwpStellarSpec'
        TVM:
          $ref: '#/components/schemas/cwpTVMSpec'
      required:
        - Symbol
        - Source
      description: Associates a nonce account (Solana); only the main account may run this.
    cwpAssociateNonceAccountStartRequest:
      description: >-
        Composes `AssociateNonceAccountIntentPayload` plus optional
        `StartOperationMetadata` (`OperationID`, `InitiatorID`). Enforces
