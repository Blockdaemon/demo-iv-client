  /api/audit/export.zip:
    get:
      tags:
        - Audit
      summary: Export Audit Logs
      description: Export audit logs based on provided startDate and endDate as zip
      operationId: ExportAudit
      parameters:
        - schema:
            type: string
          description: Start date parameter for audit logs export
          name: start_date
          in: query
          required: true
        - schema:
            type: string
          description: End date parameter for audit logs export
          name: end_date
          in: query
          required: true
        - schema:
            type: string
          description: Filter audit logs to a specific operation by its ID
          name: operation_id
          in: query
        - schema:
            type: string
          description: >-
            Comma-separated list of columns you want to appear in the final
            output .csv
          name: columns
          in: query
      responses:
