  /api/cwp/operations/start/finishCurrentBatch:
    post:
      tags:
        - Cold Wallet
      summary: Finish Current Batch
      description: >-
        Start an async Finish Current Batch operation. Closes the open batch and
        submits partial signatures for all queued transactions. Status can be
        queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartFinishCurrentBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpFinishCurrentBatchStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/deleteCurrentBatch:
    post:
      tags:
        - Cold Wallet
      summary: Delete Current Batch
      description: >-
        Start an async Delete Current Batch operation. Discards the open batch
        without signing. Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartDeleteCurrentBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpDeleteCurrentBatchStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/setErsPublicKey:
    post:
      tags:
        - Accounts
      summary: Set ERS Public Key
      description: >-
        Start an async Set ERS Public Key operation. Sets the RSA public key
        (PKIX DER) used for encrypted recovery shares. Status can be queried
        with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartSetErsPublicKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpSetERSPublicKeyStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/createAllocation:
    post:
      tags:
        - Transactions
      summary: Create Allocation
      description: >-
        Start an async Create Allocation operation. Creates a Canton allocation
        for a settlement workflow with executor, deadlines, and destination
        amounts. Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartCreateAllocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpAllocationStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/cantonEnrollment:
    post:
      tags:
        - Transactions
      summary: Canton Enrollment
      description: >-
        Start an async Canton Enrollment operation. Enrolls an external party on
        the Canton ledger. Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartCantonEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpCantonEnrollmentStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/cantonPreapproval:
    post:
      tags:
        - Transactions
      summary: Canton Preapproval
      description: >-
        Start an async Canton Preapproval operation. Creates a transfer
        preapproval for a Canton party. Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartCantonPreapproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpCantonPreapprovalStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/start/callChoiceOnEndInvestorOnboardingOffer:
    post:
      tags:
        - Transactions
      summary: End Investor Onboarding Offer (Canton)
      description: >-
        Start an async operation to exercise a choice on a Canton
        end-investor-onboarding offer contract (operation type `call choice on
        end investor onboarding offer`). Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartCallChoiceOnEndInvestorOnboardingOffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpEndInvestorOnboardingOfferStartRequest'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/id/{operationID}/status:
    get:
      tags:
        - Operations
      summary: Get operation status
      operationId: cwpgetOperationStatus
      parameters:
        - $ref: '#/components/parameters/cwpoperationID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpOperationStatus'
        '404':
          $ref: '#/components/responses/cwpNotFound'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/id/{operationID}/approvalstatus:
    get:
      tags:
        - Operations
      summary: Get operation approval status
      operationId: cwpgetOperationApprovalStatus
      parameters:
        - $ref: '#/components/parameters/cwpoperationID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpOperationApprovalStatus'
        '404':
          $ref: '#/components/responses/cwpNotFound'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/id/{operationID}/intent:
    get:
      tags:
        - Operations
      summary: Get operation intent
      description: >-
        Returns the stored intent JSON for the operation. Startable operation
        types match one variant of
        [`IntentItem`](#/components/schemas/IntentItem), including
        `OperationType` and server-populated fields such as `Timestamp` and
        `InitiatorName` when present. Older operation types that can no longer
        be started over HTTP may still be returned but are omitted from the
        `IntentItem` union.
      operationId: cwpgetOperationIntent
      parameters:
        - $ref: '#/components/parameters/cwpoperationID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpIntentItem'
        '404':
          $ref: '#/components/responses/cwpNotFound'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/id/{operationID}:
    delete:
      tags:
        - Operations
      summary: Cancel an operation
      description: >-
        Sets the operation state to Failed. Returns an error if the operation is
        already in a final state.
      operationId: cwpcancelOperationDelete
      parameters:
        - $ref: '#/components/parameters/cwpoperationID'
      responses:
        '200':
          description: Cancelled. Response body is empty (no JSON payload).
        '404':
          $ref: '#/components/responses/cwpNotFound'
        '409':
          $ref: '#/components/responses/cwpConflict'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/operations/id/{operationID}/cancel:
    post:
      tags:
        - Operations
      summary: Cancel an operation
      description: >-
        Sets the operation state to Failed. Returns an error if the operation is
        already in a final state.
      operationId: cwpcancelOperation
      parameters:
        - $ref: '#/components/parameters/cwpoperationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelledBy:
                  type: string
                  description: Identifies who triggered the cancellation.
      responses:
        '200':
          description: Cancelled. Response body is empty (no JSON payload).
        '404':
          $ref: '#/components/responses/cwpNotFound'
        '409':
          $ref: '#/components/responses/cwpConflict'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/config:
    get:
      tags:
        - Policies
      summary: Get config restrictions
      description: >-
        Returns the tenant's config restrictions. These apply to config-related
        operations (e.g. adding tokens, registering blockchain networks). When a
        restriction applies, the specified approvers must approve before the
        operation can execute.
      operationId: cwpgetConfigRestrictions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cwpConfigRestriction'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/policy:
    get:
      tags:
        - Policies
      summary: Get policy restrictions
      description: >-
        Returns the tenant's policy restrictions. These apply to policy-related
        operations (e.g. updating policy set, group, or restriction rules). When
        a restriction applies, the specified approvers must approve before the
        operation can execute.
      operationId: cwpgetPolicyRestrictions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cwpPolicyRestriction'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/transaction:
    get:
      tags:
        - Policies
      summary: Get transaction restrictions
      description: >-
        Returns the tenant's transaction restrictions. These apply to
        transaction operations (e.g. transfers). Each restriction has a filter
        with criteria (amount, fee, symbol, source, destination, etc.). A
        restriction applies when its filter matches — i.e. when all criteria are
        satisfied. When a restriction applies, the specified approvers must
        approve before the operation can execute.
      operationId: cwpgetTransactionRestrictions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cwpTransactionRestriction'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/optypes/config:
    get:
      tags:
        - Policies
      summary: Get operation types for config restrictions
      description: >-
        Returns the operation types that are covered by config restrictions. Use
        these when configuring restrictions via `GET /restrictions/config`.
      operationId: cwpgetOperationTypesForConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpOperationTypesResponse'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/optypes/policy:
    get:
      tags:
        - Policies
      summary: Get operation types for policy restrictions
      description: >-
        Returns the operation types that are covered by policy restrictions. Use
        these when configuring restrictions via `GET /restrictions/policy`.
      operationId: cwpgetOperationTypesForPolicy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpOperationTypesResponse'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/optypes/transaction:
    get:
      tags:
        - Policies
      summary: Get operation types for transaction restrictions
      description: >-
        Returns the operation types that are covered by transaction
        restrictions. Use these when configuring restrictions via `GET
        /restrictions/transaction`.
      operationId: cwpgetOperationTypesForTransaction
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpOperationTypesResponse'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/restrictions/functionNames:
    get:
      tags:
        - Policies
      summary: Names used when filtering transactions by function
      description: >-
        Returns the names you can use when a transaction restriction should
        apply only to certain kinds of on-chain actions. Call this endpoint
        whenever you need the current list; it may change as the product
        evolves.
      operationId: cwpgetRestrictionTransactionFunctionNames
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpTransactionFunctionNamesResponse'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/assetinfos/search:
    post:
      tags:
        - Assets
      summary: Search asset infos
      description: >-
        Returns asset information for all tokens matching the filter. All filter
        fields are optional. An empty filter returns all registered assets.
        Filter by CAIP-2 chain ID, chain name, CAIP-19 asset type, symbol, or
        test network.
      operationId: cwpsearchAssetInfos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpAssetInfoFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/cwpAssetInfo'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
  /api/cwp/events:
    get:
      tags:
        - Events
      summary: Subscribe to events
      description: >
        Upgrades the connection to WebSocket. The server pushes `ClientEvent`
        messages;

        the client does not send data messages.


        Event types:

        - `operation_status_update` — an operation changed status. Payload:
        `OperationStatusUpdatePayload`.

        - `approver_onboarded` — an approver completed onboarding. Payload:
        `ApproverOnboardedPayload`.


        Delivery order of events is not guaranteed. To get the current state,
        query the server.
      operationId: cwpsubscribeToEvents
      parameters:
        - name: heartbeat
          in: query
          required: false
          description: >-
            Ping interval in seconds. When set, the server sends a WebSocket
            ping at this interval and closes the connection if no pong is
            received within 5 seconds. Omit to disable pings.
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        '101':
          description: Switching Protocols — WebSocket connection established.
        '400':
          $ref: '#/components/responses/cwpBadRequest'
  /api/cwp/walletconnect/pair:
    post:
      tags:
        - WalletConnect
      summary: Pair with a WalletConnect dApp
      description: >
        Initiates a WalletConnect pairing using the URI from a dApp's QR code or
        deep link.

        The wallet will automatically negotiate supported chains and accounts
        with the dApp.
      operationId: CwpWalletConnectwalletConnectPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CwpWalletConnectPairParams'
      responses:
        '200':
          description: Pairing initiated successfully
        '400':
          $ref: '#/components/responses/CwpWalletConnectBadRequest'
        '500':
          $ref: '#/components/responses/CwpWalletConnectInternalError'
  /api/cwp/walletconnect/disconnect:
    post:
      tags:
        - WalletConnect
      summary: Disconnect a WalletConnect session
      description: >
        Disconnects an active WalletConnect session or cancels a pending
        pairing.

        The session must belong to the calling tenant.
      operationId: CwpWalletConnectwalletConnectDisconnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CwpWalletConnectDisconnectParams'
      responses:
        '200':
          description: Disconnected successfully
        '400':
          $ref: '#/components/responses/CwpWalletConnectBadRequest'
        '404':
          $ref: '#/components/responses/CwpWalletConnectNotFound'
        '500':
          $ref: '#/components/responses/CwpWalletConnectInternalError'
  /api/cwp/walletconnect/sessions:
    get:
      tags:
        - WalletConnect
      summary: List active WalletConnect sessions
      description: |
        Returns active WalletConnect sessions for the calling tenant.
        Results can be filtered by master key, account, and initiator user ID.
        The accountName filter also requires masterKeyName to be specified.
      operationId: CwpWalletConnectwalletConnectListSessions
      parameters:
        - name: masterKeyName
          in: query
          schema:
            type: string
          description: Filter by master key name.
        - name: accountName
          in: query
          schema:
            type: string
          description: Filter by account name. Requires masterKeyName to be specified.
        - name: initiatorUserID
          in: query
          schema:
            type: string
          description: Filter by initiator user ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CwpWalletConnectListSessionsResponse'
        '400':
          $ref: '#/components/responses/CwpWalletConnectBadRequest'
        '500':
          $ref: '#/components/responses/CwpWalletConnectInternalError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: authorization
      description: API key for authentication (no Bearer prefix required)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AddAddressRequest:
      required:
        - AddressName
        - CAIP19
        - VaultID
      properties:
        AddressName:
          type: string
          example: newAddress
        CAIP19:
          $ref: '#/components/schemas/CAIP19'
        VaultID:
          type: integer
          format: int64
          example: 59
    AddAddressSynchronouslyRequest:
      required:
        - AccountName
        - AddressName
        - Asset
      properties:
        AccountName:
          type: string
        AddressName:
          type: string
        Asset:
          type: string
    AddAddressSynchronouslyResponse:
      required:
        - Address
      properties:
        Address:
          type: string
    Amount:
      description: Amount in the standard unit, e.g., BTC
      type: string
    AddAssetRequest:
      required:
        - CAIP19
      properties:
        CAIP19:
          $ref: '#/components/schemas/CAIP19'
    AddBlockchainSupportedAssetRequest:
      oneOf:
        - $ref: '#/components/schemas/AddContractAssetRequest'
        - $ref: '#/components/schemas/AddCantonAssetRequest'
      discriminator:
        propertyName: Blockchain
        mapping:
          ethereum: '#/components/schemas/AddContractAssetRequest'
          kaia: '#/components/schemas/AddContractAssetRequest'
          polygon: '#/components/schemas/AddContractAssetRequest'
          base: '#/components/schemas/AddContractAssetRequest'
          besu: '#/components/schemas/AddContractAssetRequest'
          solana: '#/components/schemas/AddContractAssetRequest'
          tron: '#/components/schemas/AddContractAssetRequest'
          canton: '#/components/schemas/AddCantonAssetRequest'
    AddContractAssetRequest:
      type: object
      required:
        - Blockchain
        - CAIP2
        - ContractAddress
      properties:
        Blockchain:
          type: string
          example: ethereum
        CAIP2:
          $ref: '#/components/schemas/CAIP2'
        ContractAddress:
          type: string
          example: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
    AddCantonAssetRequest:
      type: object
      required:
        - Blockchain
        - CAIP2
        - InstrumentID
        - RegistrarPartyID
      properties:
        Blockchain:
          type: string
          enum:
            - canton
        CAIP2:
          $ref: '#/components/schemas/CAIP2'
        InstrumentID:
          type: string
          description: Token identifier in the Canton DA Utility registry
          example: Tebirkes
        RegistrarPartyID:
          type: string
          description: Registrar party ID in the Canton DA Utility registry
          example: >-
            e012e47b-fc89-46a7-8907-156d90e147b7::1220367a02fe2a1dd6e32a2ac65403b2215e0c6d2a07d6f47d0ec1b9636840cbaf9d
    AddAssetResponse:
      required:
        - MainAddress
        - Asset
        - L1Protocol
        - Network
      properties:
        MainAddress:
          type: string
        Asset:
          type: string
          example: SOL
        L1Protocol:
          type: string
          example: bitcoin
        Network:
          type: string
          example: testnet
    AddAssetSynchronouslyRequest:
      required:
        - Asset
        - Name
      properties:
        Asset:
          type: string
        Name:
          type: string
    AddAssetSynchronouslyResponse:
      required:
        - Address
      properties:
        Address:
          type: string
    AddSolanaColdAssetRequest:
      description: >-
        Request to add a Solana asset to a cold account by creating a nonce
        account
      required:
        - PayerVaultId
      properties:
        PayerVaultId:
          description: >-
            ID of the hot (online) account that will pay for nonce account
            creation
          type: integer
          format: int64
          example: 123
    AddSolanaColdAssetResponse:
      description: >-
        Response containing the async operation ID for tracking Asset addition
        into the cold account
      required:
        - AsyncOperationID
      properties:
        AsyncOperationID:
          $ref: '#/components/schemas/AsyncOperationID'
    GenericAsyncOperationResponse:
      required:
        - AsyncOperationID
      properties:
        AsyncOperationID:
          $ref: '#/components/schemas/AsyncOperationID'
    AddUsersToGroupRequest:
      required:
        - UserIds
      properties:
        UserIds:
          description: The IDs of the users you wish to add.
          type: array
          items:
            type: integer
            format: int64
          example:
            - 74
    AddUsersToGroupResponse:
      required:
        - AsyncOperationID
      properties:
        AsyncOperationID:
          $ref: '#/components/schemas/AsyncOperationID'
    Address:
      required:
        - AddressAvailableBalance
        - AddressIndex
        - MainAddress
        - Name
        - State
      properties:
        Address:
          type: string
        AddressAvailableBalance:
          $ref: '#/components/schemas/Amount'
        AddressIndex:
          $ref: '#/components/schemas/AddressIndex'
        MainAddress:
          type: boolean
        Name:
          type: string
    AddressIndex:
      description: |
        The zero-based index used in BIP-44 address derivation path
      minimum: 0
      type: integer
    AddressIndexAmount:
      properties:
        Amount:
          $ref: '#/components/schemas/Amount'
        Index:
          $ref: '#/components/schemas/AddressIndex'
      required:
        - Index
        - Amount
      type: object
    AssetDetailVault:
      required:
        - Amount
        - CreatedAt
        - ID
        - Name
      properties:
        Amount:
          type: string
        ColdVault:
          type: boolean
        CreatedAt:
          type: string
        ID:
          type: integer
          format: int64
        Name:
          type: string
        USDAmount:
          type: string
    AssetID:
      required:
        - protocol
        - network
        - symbol
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        network:
          $ref: '#/components/schemas/Network'
        symbol:
          type: string
    AssetNotInVaultInfoDto:
      required:
        - CAIP19
        - L1Protocol
        - Network
        - Abbreviation
        - Name
      properties:
        CAIP19:
          $ref: '#/components/schemas/CAIP19'
        L1Protocol:
          type: string
        Network:
          type: string
        Abbreviation:
          description: Abbreviation means asset symbol
          type: string
        Name:
          type: string
    AssetSummary:
      required:
        - Amount
        - CAIP19
        - Protocol
        - Network
        - Asset
        - Name
      properties:
        Amount:
