  /api/compliance/screen:
    post:
      tags:
        - Compliance
      summary: Transfer Funds to an Internal Vault or External Address
      description: Screen a potential transaction against OFAC compliance.
      operationId: Screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenTransferAttemptRequest'
            example:
              amount: '1'
              asset: ETH
              blockchain: ethereum
              destination: '0xce4A28264283C7862B4809d22051F0756816001e'
              isInternal: false
      responses:
