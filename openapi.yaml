      description: >
        Start an async Update Transaction Restriction operation.

        Status can be queried with [`GET
        /operation/{operationID}/status`](#/paths/~1operation~1{operationID}~1status/get).
      operationId: cwpstartUpdateTransactionRestriction
      requestBody:
        required: true
        content:
