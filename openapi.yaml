        TestNetwork:
          type: boolean
    cwpValueFilterString:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            type: string
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            type: string
    cwpValueFilterSource:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            $ref: '#/components/schemas/cwpSource'
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            $ref: '#/components/schemas/cwpSource'
    cwpValueFilterDestination:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            $ref: '#/components/schemas/cwpDestination'
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            $ref: '#/components/schemas/cwpDestination'
    cwpTransactionFunctionName:
      type: string
      enum:
        - mint
        - burn
        - canton_freeze
        - canton_unfreeze
        - canton_pause
        - canton_unpause
      description: Transaction function for transaction restriction filtering.
    cwpValueFilterTransactionFunction:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            $ref: '#/components/schemas/cwpTransactionFunctionName'
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            $ref: '#/components/schemas/cwpTransactionFunctionName'
    cwpAmountFilter:
      type: object
      description: Amount comparison filter. Currency is required when Above is non-zero.
      properties:
        Above:
          type: number
          format: double
          description: Match if amount is greater than this value.
        Currency:
          type: string
          description: Currency for Above.
    cwpSource:
      type: object
      description: Source is always internal and derived from master key and account.
      required:
        - MasterKeyName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal source.
        AccountName:
          type: string
          description: >-
            Account name of the internal source. If not specified, it matches
            any account for the master key.
    cwpDestination:
      type: object
      description: >-
        Destination is either internal (master key + account) or external
        (address).
      oneOf:
        - required:
            - Address
        - required:
            - MasterKeyName
            - AccountName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal destination.
        AccountName:
          type: string
          description: Account name of the internal destination.
        Address:
          type: string
          description: External destination address.
