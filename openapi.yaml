    parameters:
      - description: Policy ID for a particular async operation type
        in: path
        name: policyID
        required: true
        schema:
          format: int64
          type: integer
    get:
      operationId: getPolicy
      summary: Get policy by ID
      description: Retrieve details of a specific policy.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Policies
    put:
      operationId: updatePolicy
      summary: Update policy
      description: Replace the policy for a particular operation type.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyConfig'
            examples:
              call_contract_allow_specific_contract_and_destination:
                summary: >-
                  CallContract policy - allow calls to a specific contract
                  initiated by the marketops group with 1 approval from the
                  AutomatedApproverGroup1 group
                value:
                  skipConfirmations: true
                  entries:
                    - policyUpdateOpType: callContract
                      triggerGroup: marketops
                      contractAddress: '0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238'
                      approverExpression:
                        op: leaf
                        requiredCount: 1
                        groups:
                          - AutomatedApproverGroup1
              deploy_contract_from_source_account:
                summary: >-
                  DeployContract policy - allow contract deployment initiated by
                  the issuerSystemUserGroup group with 2 approvals from the
                  AutomatedApproverGroup1 group
                value:
                  skipConfirmations: true
                  entries:
                    - policyUpdateOpType: deployContract
                      triggerGroup: issuerSystemUserGroup
                      sourceAccountNames:
                        - IssuerVault
                      approverExpression:
                        op: leaf
                        requiredCount: 2
                        groups:
                          - AutomatedApproverGroup1
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Policies
