    cwpCantonSpec:
      type: object
      description: Optional Canton-specific parameters.
      properties:
        Reason:
          type: string
        Allocation:
          type: object
          properties:
            SettlementExecutorID:
              type: object
              description: >-
                Executor party as master key / account / address (see
                AddressSpec).
              properties:
                MasterKeyName:
                  type: string
                AccountName:
                  type: string
                AddressIndex:
                  type: integer
                Address:
                  type: string
            AllocationDeadline:
              type: string
              format: date-time
            SettlementDeadline:
              type: string
              format: date-time
        AllocationChoice:
          type: object
          properties:
            ContractID:
              type: string
            Choice:
              type: string
        InvokeTokenChoice:
          type: object
          properties:
            ContractID:
              type: string
            Choice:
              type: string
        RequestTokenChoice:
          type: object
          properties:
            Choice:
              type: string
            Amount:
              type: string
        TokenInformation:
          type: object
          properties:
            InstrumentAdmin:
              type: string
            InstrumentID:
              type: string
        Enrollment:
          type: object
          properties:
            PartyID:
              type: string
            PublicKey:
              type: string
              description: >-
                Hex-encoded raw Ed25519 public key bytes for topology
                transactions.
        Preapproval:
          type: object
          properties:
            PartyID:
              type: string
            DSOID:
              type: string
        UseTransferCommand:
          type: boolean
          description: >-
            When true, use the TransferCommand cold-transfer path instead of the
            round-dependent TransferFactory.
        TransferCommand:
          type: object
          properties:
            DelegatePartyID:
              type: string
            ExpiresAt:
              type: string
              format: date-time
            Nonce:
              type: integer
              format: int64
        Clawback:
          type: object
          properties:
            InstrumentConfiguration:
              type: string
            ReceiverDelegationCID:
              type: string
              nullable: true
            ClawbackAmount:
              type: string
            InputHoldingCIDs:
              type: array
              items:
                type: string
        FreezePositions:
          type: object
          properties:
            RegistrarServiceCID:
              type: string
            CredentialCIDs:
              type: array
              items:
                type: string
            DenyListCIDs:
              type: array
              items:
                type: string
            FreezeID:
              type: string
            Reason:
              type: string
            InstrumentConfigurationCID:
              type: string
        UnfreezePositions:
          type: object
          properties:
            RegistrarServiceCID:
              type: string
            CredentialCIDs:
              type: array
              items:
                type: string
            DenyListCIDs:
              type: array
              items:
                type: string
            InstrumentConfigurationCID:
              type: string
        PauseInstrument:
          type: object
          properties:
            InstrumentConfigurationCID:
              type: string
        UnpauseInstrument:
          type: object
          properties:
            InstrumentConfigurationCID:
              type: string
    cwpStellarSpec:
      type: object
      description: Optional Stellar-specific parameters.
      properties:
        Fee:
          type: integer
        Memo:
          type: object
          properties:
            type:
              type: string
            value:
              type: string
        ActivateAddress:
          type: object
          properties:
            destinationAddress:
              type: string
            amount:
              type: string
    cwpTVMSpec:
      type: object
      description: Optional TVM-specific parameters.
    cwpBlockchainSpecAtMostOne:
      oneOf:
        - not:
            anyOf:
              - required:
                  - EVM
              - required:
                  - Bitcoin
              - required:
                  - Substrate
              - required:
                  - Solana
              - required:
                  - Canton
              - required:
                  - Stellar
              - required:
                  - TVM
        - allOf:
            - required:
                - EVM
            - not:
                anyOf:
                  - required:
                      - Bitcoin
                  - required:
                      - Substrate
                  - required:
                      - Solana
                  - required:
                      - Canton
                  - required:
                      - Stellar
                  - required:
                      - TVM
        - allOf:
            - required:
                - Bitcoin
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Substrate
                  - required:
                      - Solana
                  - required:
                      - Canton
                  - required:
                      - Stellar
                  - required:
                      - TVM
        - allOf:
            - required:
                - Substrate
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Bitcoin
                  - required:
                      - Solana
                  - required:
                      - Canton
                  - required:
                      - Stellar
                  - required:
                      - TVM
        - allOf:
            - required:
                - Solana
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Bitcoin
                  - required:
                      - Substrate
                  - required:
                      - Canton
                  - required:
                      - Stellar
                  - required:
                      - TVM
        - allOf:
            - required:
                - Canton
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Bitcoin
                  - required:
                      - Substrate
                  - required:
                      - Solana
                  - required:
                      - Stellar
                  - required:
                      - TVM
        - allOf:
            - required:
                - Stellar
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Bitcoin
                  - required:
                      - Substrate
                  - required:
                      - Solana
                  - required:
                      - Canton
                  - required:
                      - TVM
        - allOf:
            - required:
                - TVM
            - not:
                anyOf:
                  - required:
                      - EVM
                  - required:
                      - Bitcoin
                  - required:
                      - Substrate
                  - required:
                      - Solana
                  - required:
                      - Canton
                  - required:
                      - Stellar
    cwpDestinationAmount:
      type: object
      description: >-
        A single transfer destination with amount. Use Destination for vault
        name (internal) or address (external). MasterKeyName is required for
        internal transfers.
      additionalProperties: false
      required:
        - Destination
        - Amount
      properties:
        Destination:
          type: string
          description: Recipient vault name (internal) or blockchain address (external).
        MasterKeyName:
          type: string
          description: >-
            Master key name for internal destination. Ignored for external
            transfers.
        Amount:
          type: string
          description: Amount to transfer.
    cwpStartOperationResponse:
      type: object
      required:
        - OperationID
      properties:
        OperationID:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,96}$
    cwpOperationStatus:
      type: object
      required:
        - Status
      properties:
        Status:
          $ref: '#/components/schemas/cwpStatus'
        ErrorDetails:
          $ref: '#/components/schemas/cwpErrorDetails'
        Result:
          $ref: '#/components/schemas/cwpResult'
    cwpStatus:
      type: string
      enum:
        - Pending initialization
        - Pending confirmation
        - Pending approval
        - Pending execution
        - Executing
        - Pending signature
        - Failed
        - Succeeded
    cwpErrorDetails:
      type: object
      description: Present when Status is Failed.
      required:
        - Status
        - ErrorCode
      properties:
        Status:
          $ref: '#/components/schemas/cwpStatus'
        ErrorCode:
          type: string
          example: M0001
        Properties:
          type: object
          additionalProperties: true
        Timestamp:
          type: string
          format: date-time
    cwpResult:
      type: object
      description: >-
        Present when Status is Succeeded. Populated fields depend on operation
        type.
      properties:
        Backup:
          type: array
          description: Present for the Backup master key operation.
          items:
            $ref: '#/components/schemas/cwpKeyBackup'
        ReceiveAddress:
          $ref: '#/components/schemas/cwpAddress'
          description: >-
            Present for Get address (deprecated) and Canton enrollment
            operations.
        Transaction:
          $ref: '#/components/schemas/cwpTransaction'
          description: >
            Present for transaction-creating operations: Transfer, Make
            transaction, Stake, Unstake,

            Allocation, Create account, Associate to SPL token, Associate nonce
            account,

            Activate stellar address, Call contract, Deploy contract,
            Consolidate funds,

            Fund subaddresses, Sign raw transaction, Canton preapproval, and
            Finish current batch

            (when the batch contains transaction operations).
        TransactionBatch:
          type: array
          description: Present for Create batch operation.
          items:
            type: string
            format: byte
        GenericSignature:
          $ref: '#/components/schemas/cwpSignedMessage'
          description: >-
            Present for Generic signing and Finish current batch (when batch
            contains signing operations).
        ConsolidationData:
          $ref: '#/components/schemas/cwpConsolidationData'
          description: Present for Generate consolidation data operation.
    cwpKeyBackup:
      type: object
      required:
        - Type
        - Backup
      properties:
        Type:
          type: string
          enum:
            - ECDSA_SECP256K1
            - EdDSA_Ed25519
        Backup:
          type: string
          format: byte
    cwpAddress:
      type: object
      required:
        - Encoding
        - Index
      properties:
        Encoding:
          type: string
        Index:
          type: integer
    cwpTransaction:
      type: object
      properties:
        ID:
          type: string
        CantonContractID:
          type: string
        SignedTransaction:
          type: string
        Fee:
          type: string
          deprecated: true
        SenderAddresses:
          type: array
          deprecated: true
          items:
            $ref: '#/components/schemas/cwpAddress'
        BlockChainTransaction:
          type: string
          format: byte
          deprecated: true
    cwpSignedMessage:
      type: object
      properties:
        Signature:
          type: string
          format: byte
        Message:
          type: string
    cwpConsolidationData:
      type: object
      required:
        - Data
      properties:
        Data:
          type: string
          description: Hex-encoded method call data
        EIP7702Authorizations:
          type: array
          items:
            type: string
            format: byte
        EIP7702AuthorizationsForReset:
          type: array
          items:
            type: string
            format: byte
    cwpOperationApprovalStatus:
      type: object
      properties:
        ApprovedBy:
          type: array
          items:
            type: string
        RejectedBy:
          type: array
          items:
            type: string
        PendingApprovals:
          type: array
          description: Empty if RejectedBy is non-empty.
          items:
            type: string
    cwpApproversByGroups:
      type: object
      description: Groups and the number of approvers required across all listed groups.
      required:
        - Groups
        - RequiredApprovers
      properties:
        Groups:
          type: array
          description: >-
            Groups from which approvals are requested. At least one group must
            be specified.
          minItems: 1
          items:
            type: string
        RequiredApprovers:
          type: integer
          description: Number of approvers required in total across all groups.
          minimum: 1
    cwpConfigRestriction:
      type: object
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required if the restriction matches.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
    cwpPolicyRestriction:
      type: object
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required if the restriction matches.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
    cwpOperationTypesResponse:
      type: array
      description: >-
        List of operation type strings. Same values as elsewhere in this API;
        see `GET /restrictions/optypes/*` for category-specific subsets.
      items:
        type: string
    cwpTransactionFunctionNamesResponse:
      type: array
      description: List of names for filtering transactions by function.
      items:
        type: string
    cwpTransactionRestriction:
      type: object
      required:
        - RestrictionID
      properties:
        RestrictionID:
          type: string
          description: Restriction identifier.
        Approvers:
          type: array
          description: Approvers required if the restriction matches.
          items:
            $ref: '#/components/schemas/cwpApproversByGroups'
        Amount:
          $ref: '#/components/schemas/cwpAmountFilter'
        Fee:
          $ref: '#/components/schemas/cwpAmountFilter'
        Symbol:
          $ref: '#/components/schemas/cwpValueFilterString'
        Source:
          $ref: '#/components/schemas/cwpValueFilterSource'
        Destination:
          $ref: '#/components/schemas/cwpValueFilterDestination'
        ExternalDestination:
          description: A non-null empty filter matches any external destination.
          allOf:
            - $ref: '#/components/schemas/cwpValueFilterString'
        TransactionFunction:
          $ref: '#/components/schemas/cwpValueFilterTransactionFunction'
        TestNetwork:
          type: boolean
    cwpValueFilterString:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            type: string
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            type: string
    cwpValueFilterSource:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            $ref: '#/components/schemas/cwpSource'
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            $ref: '#/components/schemas/cwpSource'
    cwpValueFilterDestination:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            $ref: '#/components/schemas/cwpDestination'
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            $ref: '#/components/schemas/cwpDestination'
    cwpValueFilterTransactionFunction:
      type: object
      description: >
        Matches values against one of two lists. At most one of Only or Except
        can be non-empty.

        Only matches if any listed value matches. Except matches if no listed
        value matches (denylist).

        If both lists are empty, the filter matches any value.

        Use names from `GET /restrictions/functionNames`.
      properties:
        Only:
          type: array
          description: Match if any listed value matches.
          items:
            type: string
        Except:
          type: array
          description: Match if no listed value matches.
          items:
            type: string
    cwpAmountFilter:
      type: object
      description: Amount comparison filter. Currency is required when Above is non-zero.
      properties:
        Above:
          type: number
          format: double
          description: Match if amount is greater than this value.
        Currency:
          type: string
          description: Currency for Above.
    cwpSource:
      type: object
      description: Source is always internal and derived from master key and account.
      required:
        - MasterKeyName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal source.
        AccountName:
          type: string
          description: >-
            Account name of the internal source. If not specified, it matches
            any account for the master key.
    cwpDestination:
      type: object
      description: >-
        Destination is either internal (master key + account) or external
        (address).
      oneOf:
        - required:
            - Address
        - required:
            - MasterKeyName
            - AccountName
      properties:
        MasterKeyName:
          type: string
          description: Master key name of the internal destination.
        AccountName:
          type: string
          description: Account name of the internal destination.
        Address:
          type: string
          description: External destination address.
    cwpErrorResponse:
      type: object
      required:
        - message
      properties:
        errorCode:
          type: string
          description: MPA error code (M-prefixed). Only for MPA system errors.
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Additional error data. Only for MPA system errors.
    CwpWalletConnectPairParams:
      type: object
      description: Parameters for initiating a WalletConnect pairing.
      additionalProperties: false
      required:
        - uri
        - masterKeyName
        - accountName
      properties:
        uri:
          type: string
          description: WalletConnect pairing URI from the dApp (starts with "wc:").
        masterKeyName:
          type: string
          description: Master key name to use for signing.
        accountName:
          type: string
          description: Account name to use for signing.
        initiatorUserID:
          type: string
          description: Optional user ID of the initiator. Used for policy evaluation.
    CwpWalletConnectDisconnectParams:
      type: object
      description: Parameters for disconnecting a WalletConnect session.
      additionalProperties: false
      required:
        - topic
      properties:
        topic:
          type: string
          description: Session or pairing topic to disconnect.
    CwpWalletConnectListSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/CwpWalletConnectSessionInfo'
    CwpWalletConnectSessionInfo:
      type: object
      description: Summary of an active WalletConnect session.
      required:
        - topic
        - peerMetadata
        - expiry
        - accounts
      properties:
        topic:
          type: string
          description: Session topic identifier.
        peerMetadata:
          $ref: '#/components/schemas/CwpWalletConnectPeerMetadata'
        expiry:
          type: integer
          format: int64
          description: Session expiry as a Unix timestamp.
        accounts:
          type: array
          description: CAIP-10 account identifiers approved for this session.
          items:
            type: string
    CwpWalletConnectPeerMetadata:
      type: object
      description: Metadata of the connected dApp.
      properties:
        name:
          type: string
          description: Human-readable name of the dApp.
        description:
          type: string
          description: Short description of the dApp.
        url:
          type: string
          description: Homepage URL of the dApp.
        icons:
          type: array
          description: Icon URLs for the dApp.
          items:
            type: string
        verifyUrl:
          type: string
          description: >-
            WalletConnect Verify API server URL used for domain verification and
            anti-phishing.
    CwpWalletConnectErrorResponse:
      type: object
      required:
        - message
      properties:
        errorCode:
          type: string
          description: MPA error code (M-prefixed). Only for MPA system errors.
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Additional error data. Only for MPA system errors.
  responses:
    BadRequest:
      description: >-
        The request was invalid, included validation errors, or cannot be
        served.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The server understood the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: The server has encountered a situation it doesn't know how to handle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The server is not ready to handle requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required and has failed or has not been provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    cwpBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpNotFound:
      description: Unknown operation ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpInternalError:
      description: >
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data`

        from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    CwpWalletConnectBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectNotFound:
      description: Resource not found (session or tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectInternalError:
      description: >
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data`

        from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: authorization
      description: API key for authentication (no Bearer prefix required)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-tagGroups:
  - name: Institutional Wallet
    tags:
      - Accounts
      - Addresses
      - Assets
      - Audit Logs
      - Cold Wallet
      - Config
      - Events
      - Groups
      - Key Backups
      - Policies
      - Compliance
      - Staking
      - Automated Approvers
      - Transactions
      - Operations
      - Users
      - Health
  - name: CWP HTTP API
    tags:
      - CWP Operations
  - name: CWP WalletConnect API
    tags:
      - CWP WalletConnect
