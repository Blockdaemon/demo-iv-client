        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/batches/{batchID}/signed/upload:
    description: |
      Upload the signed version of the batch identified by batch ID. Once the
      required count of signatures is reached, the batch will be finalized.
    parameters:
      - description: Batch ID
        in: path
        name: batchID
        required: true
        schema:
          format: int64
          type: integer
    post:
      operationId: postSignedColdBatchByUpload
      summary: Upload signed batch
      description: Upload the signed version of the batch identified by batch ID. Once the required count of signatures is reached, the batch will be finalized.
      tags:
        - Cold Wallet
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                signed_transaction_batch:
                  format: binary
                  type: string
                  description: An array of signed transaction batches (by cold wallets)
      responses:
        "201":
          description: Signed batch successfully uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
