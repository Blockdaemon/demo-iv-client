        - MasterKey
        - Account
        - Symbol
        - Testnet
      properties:
        MasterKey:
          type: string
          description: Master key name.
        Account:
          type: string
          description: Account name.
        Symbol:
          type: string
          description: Asset symbol (e.g., ETH, BTC).
        Index:
          type: integer
          description: Address index. Default 0.
          default: 0
        Testnet:
          type: boolean
          description: Whether to use test network.
    cwpGetAddressCAIP2Request:
      type: object
      description: >-
        Request to get an address for the native asset of a chain identified by
        CAIP-2.
      additionalProperties: false
      required:
        - MasterKey
        - CAIP2
        - Account
      properties:
        MasterKey:
          type: string
          description: Master key name.
        CAIP2:
          type: string
          description: Chain identifier in CAIP-2 format (e.g., eip155:1, eip155:17000).
        Account:
          type: string
          description: Account name.
        Index:
          type: integer
          description: Address index. Default 0.
          default: 0
    cwpGetAddressResponse:
      type: object
      required:
        - Address
      properties:
        Address:
          type: string
          description: The blockchain address.
    cwpResolveAddressRequest:
      type: object
      additionalProperties: false
      required:
        - Address
      properties:
        Address:
          type: string
          description: The blockchain address to resolve.
    cwpResolveAddressResponse:
      type: object
      required:
        - MasterKey
        - Account
        - Index
      properties:
        MasterKey:
          type: string
          description: Master key name.
        Account:
          type: string
          description: Account name.
        Index:
          type: integer
          description: Address index within the account.
    cwpAssetInfoFilter:
      type: object
      description: >-
        Filter for asset info search. All fields are optional. An empty object
        returns all assets.
      additionalProperties: false
      properties:
        CAIP2:
          type: string
          description: Chain ID according to CAIP-2 (e.g. "eip155:1").
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type:
            - boolean
            - 'null'
          description: >-
            If `true` or `false`, restrict to that testnet/mainnet flag. Omit
            the field or send JSON `null` to apply no testnet filter.
    cwpAssetInfo:
      type: object
      description: >
        Asset information for a registered token. Search results include only
        these fields (use `CAIP2` on

        [`AssetInfoFilter`](#/components/schemas/AssetInfoFilter) to filter by
        chain, not as a response field).
      required:
        - ChainName
        - CAIP19
        - Symbol
        - TestNetwork
      properties:
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type: boolean
          description: Whether the chain is a test network.
    cwpRegisterKnownChainRequest:
      type: object
      description: Request to register a chain from the built-in chain registry.
      additionalProperties: false
      required:
        - CAIP2
      properties:
        CAIP2:
          type: string
          description: CAIP-2 chain identifier (e.g. "eip155:1" for Ethereum mainnet).
    cwpChain:
      type: object
      description: A registered chain row returned by `GET /chains/list`.
      required:
        - ChainName
        - TestNet
        - CAIP2
      properties:
        ChainName:
          type: string
          description: Canonical name of the chain.
        TestNet:
          type: boolean
          description: Whether this is a test network.
        CAIP2:
          type: string
          description: CAIP-2 chain identifier.
    cwpToken:
      type: object
      description: A registered token row returned by `GET /tokens/list`.
      required:
        - ChainName
        - Testnet
        - Symbol
        - Decimals
        - CAIP2
        - CAIP19
      properties:
        ChainName:
          type: string
        Testnet:
          type: boolean
          description: Whether the chain is a test network.
        Symbol:
          type: string
        Decimals:
          type: integer
        CAIP2:
          type: string
        CAIP19:
          type: string
    cwpOperationFilter:
      type: object
      description: >
        Filter for operation search. All fields are optional. Omitting
        `Statuses` restricts results to operations

        not in `Succeeded` or `Failed`. `OperationTypes` entries are operation
        type strings;

        see
        [`OperationTypesResponse`](#/components/schemas/OperationTypesResponse)
        and `GET /restrictions/optypes/*`.
      additionalProperties: false
      properties:
        OperationIDs:
          type: array
          description: If non-empty, only intents for these operation IDs.
          items:
            type: string
        OperationTypes:
          type: array
          items:
            type: string
        Statuses:
          type: array
          description: >-
            If non-empty, only operations whose status matches one of these
            values.
          items:
            $ref: '#/components/schemas/cwpStatus'
        Limit:
          type: integer
          description: Maximum number of intents to return. Omit or `0` for no limit.
          minimum: 0
    cwpListOperationsResult:
      type: object
      required:
        - Intents
      properties:
        Intents:
          type: array
          items:
            $ref: '#/components/schemas/cwpIntentItem'
    cwpAddressSpecSearch:
      type: object
      description: >-
        Wallet source (master key + account and optional sub-address) or an
        external destination address.
      properties:
        MasterKeyName:
          type: string
          description: >-
            Required for all sources. For destinations, omit when `Address` is
            set.
        AccountName:
          type: string
          description: >-
            Required for all sources. For destinations, omit when `Address` is
            set.
        AddressIndex:
          type: integer
          description: Sub-address index within the account; `0` is the main address.
        Address:
          type: string
          description: >-
            Destination address; use instead of master key, account, and index.
            Only for destinations; ignored for sources.
    cwpTxOutputSearch:
      type: object
      description: >-
        Transaction output combining destination address fields with a transfer
        amount.
      required:
        - Amount
      properties:
        Amount:
          type: string
          description: Amount for this output (required).
        MasterKeyName:
          type: string
          description: >-
            Required for all sources. For destinations, omit when `Address` is
            set.
        AccountName:
          type: string
          description: >-
            Required for all sources. For destinations, omit when `Address` is
            set.
        AddressIndex:
          type: integer
          description: Sub-address index within the account; `0` is the main address.
        Address:
          type: string
          description: >-
            Destination address; use instead of master key, account, and index.
            Only for destinations; ignored for sources.
    cwpAddressIndexAmountSearch:
      type: object
      description: Sub-address index with an amount (e.g. funding sub-addresses).
      properties:
        Index:
          type: integer
          description: Index of the sub-address; resolved to a concrete on-chain address.
        Amount:
          type: string
          description: Amount associated with that sub-address.
    cwpSubAddressDataSearch:
      type: object
      description: >-
        One asset and sub-address row when consolidating from multiple
        sub-addresses.
      properties:
        Asset:
          type: string
          description: Asset symbol for this consolidation row.
        Amount:
          type: string
          description: Amount for this sub-address.
        SubAddressIndex:
          type: integer
          description: Index of the sub-address within the account.
    cwpExternalPairingMessageSearch:
      type: object
      description: Single pairing message when attaching an external master key.
      properties:
        Value:
          type: string
          format: byte
          description: Raw pairing message bytes (base64 in JSON).
    cwpPartialSignaturesSearch:
      type: object
      description: Partial signatures for one transaction inside a signing batch.
      properties:
        SignaturesForTx:
          type: array
          description: >-
            Partial signature blobs for one transaction (each entry is
            base64-encoded bytes).
          items:
            type: array
            items:
              type: string
              format: byte
    cwpRateUpdateSearch:
      type: object
      description: USD spot rate or min/max bounds for one asset in a rate update.
      properties:
        Asset:
          type: string
          description: Asset identifier (required).
        USDRate:
          type: number
          format: double
          description: Fixed USD rate; cannot be combined with min or max bounds.
        USDMin:
          type: number
          format: double
          description: Minimum allowed USD rate; cannot be combined with `USDRate`.
        USDMax:
          type: number
          format: double
          description: >-
            Maximum allowed USD rate; must be ≥ `USDMin` when used; cannot be
            combined with `USDRate`.
    cwpPolicyApproverExpressionSearch:
      type: object
      description: >-
        Tree of approver requirements (`and` / `or` / `leaf`) or unconditional
        `allow` / `block`.
      properties:
        Op:
          type: string
          description: and, or, leaf, allow, or block.
        SubExpressions:
          type: array
          description: Nested expressions when `Op` is `and` or `or`.
          items:
            $ref: '#/components/schemas/cwpPolicyApproverExpressionSearch'
        Groups:
          type: array
          description: >-
            Group names when `Op` is `leaf`. If empty, a user from any group not
            otherwise referenced may approve.
          items:
            type: string
        RequiredCount:
          type: integer
          description: >-
            Number of approvers required from `Groups` for a `leaf`. `-1` with
            non-empty `Groups` means all members of those groups (validated
            server-side).
    cwpPolicySetEntrySearch:
      type: object
      description: >-
        One policy row in an update; which fields matter depends on the policy
        operation type.
      properties:
        TriggerGroup:
          type: string
          description: Group the rule applies to for all operation types.
        MinAmount:
          type: string
          description: Used for transfer-style rules.
        AmountCurrency:
          type: string
          description: Currency context for amounts and fees.
        TxCurrencies:
          type: array
          description: Allowed transaction currencies for transfer-style rules.
          items:
            type: string
        Sources:
          type: array
          description: Allowed source accounts or identifiers for transfer-style rules.
