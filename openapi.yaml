        - $ref: '#/components/parameters/DestinationExt'
        - $ref: '#/components/parameters/DestinationAcc'
        - $ref: '#/components/parameters/TransactionIDs'
        - name: fromAddresses
          description: Set of the addresses of the sources of the transactions
          in: query
          schema:
            type: array
            items:
              type: string
        - name: toAddresses
          description: Set of the addresses of the destinations of the transactions
          in: query
          schema:
            type: array
            items:
              type: string
        - name: fromAccounts
          description: Set of the IDs of the source accounts of transactions
          in: query
          schema:
            items:
              type: integer
              format: int64
            type: array
            example:
              - 1
              - 2
              - 3
        - name: toAccounts
          description: Set of the IDs of the destination accounts of transactions
          in: query
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 1
              - 2
              - 3
        - name: transactionStatuses
          description: Set of transaction statuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionStatus'
        - name: transactionTypes
          in: query
          description: Set of transaction types
          schema:
            items:
              $ref: '#/components/schemas/TransactionType'
            type: array
