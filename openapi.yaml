    cwpTransactionIntent:
      type: object
      description: >
        Intent to make a transaction. Specifies source, destinations, and
        amounts.

        For internal destinations use MasterKeyName and AccountName. For
        external destinations use Address.

        Optional blockchain-specific fields: EVM, Bitcoin, Substrate, Solana,
        Canton, Stellar, TVM. At most one can be set.
      additionalProperties: false
      required:
        - Asset
        - Source
        - Destination
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Asset:
          type: string
          description: Asset symbol (e.g., BTC, ETH, SOL).
        TestNetwork:
          type: boolean
          default: false
          description: Whether to use testnet.
        Source:
          type: object
          description: Source account. MasterKeyName and AccountName identify the account.
          required:
            - MasterKeyName
            - AccountName
          properties:
            MasterKeyName:
              type: string
              description: Master key name.
            AccountName:
              type: string
              description: Account name.
            AddressIndex:
              type: integer
              description: Subaddress index (0 for main address).
        Destination:
          type: array
          description: >
            Transaction outputs. For internal transfers specify MasterKeyName
            and AccountName.

            For external transfers specify Address.
          minItems: 1
          items:
            type: object
            required:
              - Amount
            properties:
              Amount:
                type: string
                description: Amount to send.
              MasterKeyName:
                type: string
                description: For internal destination. Master key name.
              AccountName:
                type: string
                description: For internal destination. Account name.
              AddressIndex:
                type: integer
                description: For internal destination. Subaddress index.
              Address:
                type: string
                description: For external destination. Blockchain address.
        RawTransaction:
          type: string
          description: >-
            Optional unsigned transaction (blockchain-encoded). Used with TxHash
            for precomputed signing.
        TxHash:
          type: string
          description: >-
            Precomputed hash of tx to be signed. Requires RawTransaction when
            specified.
