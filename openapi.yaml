    parameters:
      - description: Batch ID
        in: path
        name: batchID
        required: true
        schema:
          format: int64
          type: integer
    get:
      operationId: getColdBatchByDownload
      summary: Download batch
      description: Download the unsigned batch identified by batch ID for cold wallet signing.
      tags:
        - Cold Wallet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: string
                  master_key_id:
                    type: string
                  encrypted_transaction_batch:
                    type: string
                required:
                  - signature
                  - master_key_id
                  - encrypted_transaction_batch
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
