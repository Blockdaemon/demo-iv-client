          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
        - $ref: '#/components/parameters/AccountIDQuery'
        - $ref: '#/components/parameters/AssetIDs'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
        - $ref: '#/components/parameters/Creator'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Hash'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SourceExt'
        - $ref: '#/components/parameters/SourceAcc'
        - $ref: '#/components/parameters/DestinationExt'
        - $ref: '#/components/parameters/DestinationAcc'
        - $ref: '#/components/parameters/TransactionIDs'
        - name: fromAddresses
          description: Set of the addresses of the sources of the transactions
          in: query
          schema:
            type: array
            items:
              type: string
        - name: toAddresses
          description: Set of the addresses of the destinations of the transactions
          in: query
          schema:
            type: array
            items:
              type: string
        - name: fromAccounts
          description: Set of the IDs of the source accounts of transactions
          in: query
          schema:
            items:
              type: integer
              format: int64
            type: array
            example:
              - 1
              - 2
              - 3
        - name: toAccounts
          description: Set of the IDs of the destination accounts of transactions
          in: query
          schema:
            type: array
            items:
              type: integer
              format: int64
            example:
              - 1
              - 2
              - 3
        - name: transactionStatuses
          description: Set of transaction statuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionStatus'
        - name: transactionTypes
          in: query
          description: Set of transaction types
          schema:
            items:
              $ref: '#/components/schemas/TransactionType'
            type: array
        - name: waitingToBeBatched
          in: query
          description: |
            When set, all cold transactions waiting to be batched are returned.
          schema:
            type: boolean
      tags:
        - Transactions
  /api/v2/transactions/{transactionID}:
    get:
      operationId: getTransaction
      summary: Get transaction by ID
      description: Retrieve details of a specific transaction.
      tags:
        - Transactions
      parameters:
        - name: transactionID
          schema:
            $ref: '#/components/schemas/TransactionID'
          description: ID of the transaction
          in: path
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: cancelTransaction
      summary: Cancel a transaction
      description: >
        Cancel a pending transaction by cancelling its underlying MPA operation.

        This will set the transaction's status to "Cancelled". Only transactions

        that are not yet in a final state (Succeeded, Failed, Cancelled,
        Rejected,

        Error) can be cancelled.
      tags:
        - Transactions
      parameters:
        - name: transactionID
          schema:
            $ref: '#/components/schemas/TransactionID'
          description: ID of the transaction to cancel
          in: path
          required: true
      responses:
        '204':
          description: Transaction cancelled successfully
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >-
            Transaction cannot be cancelled (e.g., already in final state, no
            associated MPA operation)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Transaction not found
        '409':
          description: Operation cannot be cancelled (already in final state)
        '500':
          $ref: '#/components/responses/InternalServerError'
