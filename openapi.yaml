        A single transfer destination with amount. Use Destination for vault
        name (internal) or address (external). MasterKeyName is required for
        internal transfers.
      additionalProperties: false
      required:
        - Destination
        - Amount
      properties:
        Destination:
          type: string
          description: Recipient vault name (internal) or blockchain address (external).
        MasterKeyName:
          type: string
          description: >-
            Master key name for internal destination. Ignored for external
            transfers.
        Amount:
          type: string
          description: Amount to transfer.
    cwpTransferIntent:
      type: object
      description: >
        Intent to transfer assets from a source account to one or more
        destinations.

        For internal transfers specify DestinationType "internal" and use
        Destination as vault name with MasterKeyName in each DestinationAmount.

        For external transfers specify DestinationType "external" and use
        Destination as blockchain address.

        Optional blockchain-specific fields: EVM, Bitcoin, Substrate, Solana,
        Canton, Stellar, TVM. At most one can be set.
      additionalProperties: false
      required:
        - Asset
        - Source
        - MasterKeyName
        - DestinationType
        - DestinationAmounts
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Asset:
          type: string
          description: Asset symbol (e.g., BTC, ETH, SOL).
        TestNetwork:
          type: boolean
          default: false
          description: Whether to use testnet.
        Source:
          type: string
          description: Name of source account.
        MasterKeyName:
          type: string
          description: Master key name for the source account.
        DestinationType:
          type: string
          enum:
            - internal
            - external
          description: |
            internal - transfer to another wallet account (vault).
            external - transfer to blockchain address.
        DestinationAmounts:
          type: array
          description: >
            For UTXO-based blockchains, a transaction output is generated for
            each amount.

            For account-based blockchains and internal transfers, this list must
            have length 1.
          minItems: 1
          items:
            $ref: '#/components/schemas/cwpDestinationAmount'
        EVM:
