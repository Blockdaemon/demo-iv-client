  /api/cwp/operation/start/registerCustomChain:
    post:
      summary: Start Register Custom Chain operation
      description: >
        Start an async Register Custom Chain operation. Registers a custom chain
        (CAIP-2)

        and its native asset (CAIP-19). The chain ID is derived from the native
        asset type.

        The operation is idempotent; registering an already-known chain updates
        it.

        Status can be queried with [`GET
        /operation/{operationID}/status`](#/paths/~1operation~1{operationID}~1status/get).
      operationId: cwpstartRegisterCustomChain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpRegisterCustomChainIntent'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
      tags:
        - CWP Operations
  /api/cwp/chain/registerknown:
    post:
      summary: Register a known chain
      description: >
        Register a chain from the built-in chain registry. All chain metadata
        (name,

        native asset, coin type, decimals, etc.) is resolved from the CAIP-2
        identifier.

        The call is idempotent: succeeds if the chain is already registered with
        identical

        data, but fails if existing data conflicts.
      operationId: cwpregisterKnownChain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpRegisterKnownChainRequest'
      responses:
        '200':
          description: Chain registered successfully
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
