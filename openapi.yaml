  /api/cwp/operations/start/generateConsolidationData:
    post:
      summary: Start Generate Consolidation Data operation
      description: >
        Start an async Generate Consolidation Data operation. Computes call data
        and EIP-7702 authorizations

        needed for a subsequent consolidation transaction.

        Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
