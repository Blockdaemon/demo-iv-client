  /api/cwp/operations/search:
    post:
      summary: Search operations
      description: >
        Returns operations' intents matching the filter. If `Statuses` is
        omitted or empty, only operations

        that are not in a final state (`Succeeded` or `Failed`) are included. If
        `Limit` is omitted or zero,

        there is no cap on the number of results.

        Each element of `Intents` is a JSON intent. `OperationType` identifies
        which intent variant applies; see `IntentItem`.

        Returned intents also include common metadata on every item: what is
        being requested (`OperationType`),

        optional caller-chosen identifiers (`OperationID`, `InitiatorID`), and
        server fields such as `Timestamp`

        and `InitiatorName` when present (same fields as documented on each
        variant under `IntentItem`).
      operationId: cwpsearchOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpOperationFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpListOperationsResult'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
      tags:
        - CWP Operations
