      additionalProperties: false
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        Add:
          $ref: '#/components/schemas/cwpPolicyRestriction'
          description: Optional. Restriction to add.
        Delete:
          $ref: '#/components/schemas/cwpPolicyRestriction'
          description: Optional. Restriction to delete.
    cwpUpdateTransactionRestrictionIntent:
      type: object
      description: >-
        Intent to update transaction restrictions. At least one of Add or Delete
        must be set; both are allowed.
      additionalProperties: false
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        Add:
          $ref: '#/components/schemas/cwpTransactionRestriction'
          description: Optional. Restriction to add.
        Delete:
          $ref: '#/components/schemas/cwpTransactionRestriction'
          description: Optional. Restriction to delete.
    cwpEVMSpec:
      type: object
      description: Optional EVM-specific parameters.
      properties:
