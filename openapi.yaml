          type: string
          description: Extra tip (lowest denomination).
        Nonce:
          type: string
          description: Transaction nonce.
    cwpSolanaSpec:
      type: object
      description: Optional Solana-specific parameters.
      properties:
        PriorityFee:
          type: integer
          description: Priority fee (micro-lamports per compute unit).
        AssociateTokenAccount:
          type: object
          properties:
            MintAddress:
              type: string
        SPLTokenTransfer:
          type: object
          properties:
            amount:
              type: string
