  /api/cwp/operations/start/createBatch:
    post:
      summary: Start Create Batch operation
      description: >
        Start an async Create Batch operation. Opens a signing batch for a
        master key; transactions are queued

        until the batch is finished or deleted.

        Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartCreateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cwpCreateBatchIntent'
      responses:
        '200':
          description: Operation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cwpStartOperationResponse'
        '400':
          $ref: '#/components/responses/cwpBadRequest'
        '500':
          $ref: '#/components/responses/cwpInternalError'
      tags:
        - CWP Operations
  /api/cwp/operations/start/finishCurrentBatch:
    post:
      summary: Start Finish Current Batch operation
      description: >
        Start an async Finish Current Batch operation. Closes the open batch and
        submits partial signatures

        for all queued transactions.

        Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartFinishCurrentBatch
      requestBody:
        required: true
