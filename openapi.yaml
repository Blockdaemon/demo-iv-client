  /api/cwp/operations/start/consolidateFunds:
    post:
      summary: Start Consolidate Funds operation
      description: >
        Start an async Consolidate Funds operation. Moves funds from a
        sub-address back to the main address.

        Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
