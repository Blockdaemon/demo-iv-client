      description: Download the list of audit-logs as a zip file.
      tags:
        - Audit Logs
      parameters:
        - name: start_date
          description: Start date parameter for audit logs export
          in: query
          required: true
          schema:
            type: string
        - name: end_date
          description: End date parameter for audit logs export
          in: query
          required: true
          schema:
            type: string
        - name: user_filter
          description: Boolean parameter for specifying whether to filter audit logs down to user events
          in: query
          schema:
            type: boolean
        - name: policy_filter
          description: Boolean parameter for specifying whether to filter audit logs down to policy events
          in: query
          schema:
            type: boolean
        - name: staking_filter
          description: Boolean parameter for specifying whether to filter audit logs down to staking events
          in: query
          schema:
            type: boolean
        - name: fee_filter
          description: Boolean parameter for specifying whether to filter audit logs down to gas/fee-burning events
          in: query
          schema:
            type: boolean
        - name: smart_contract_filter
          description: Boolean parameter for specifying whether to filter audit logs down to smart contract events
          in: query
          schema:
            type: boolean
        - name: columns
          description: Comma-separated list of columns you want to appear in the final output .csv
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
