        Account:
          type: string
          description: Account name.
        Symbol:
          type: string
          description: Asset symbol (e.g., ETH, BTC).
        Index:
          type: integer
          description: Address index. Default 0.
          default: 0
        Testnet:
          type: boolean
          description: Whether to use test network.
    cwpGetAddressResponse:
      type: object
      required:
        - Address
      properties:
        Address:
          type: string
          description: The blockchain address.
    cwpAssetInfoFilter:
      type: object
      description: >-
        Filter for asset info search. All fields are optional. An empty object
        returns all assets.
      additionalProperties: false
      properties:
        CAIP2:
          type: string
          description: Chain ID according to CAIP-2 (e.g. "eip155:1").
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type: boolean
          description: When set, filter by test network status.
    cwpAssetInfo:
      type: object
      description: Asset information for a registered token.
      required:
        - CAIP2
        - ChainName
        - CAIP19
        - Symbol
        - TestNetwork
      properties:
        CAIP2:
          type: string
          description: Chain ID according to CAIP-2 (e.g. "eip155:1").
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Bitcoin Testnet4").
        CAIP19:
          type: string
          description: Asset type according to CAIP-19 (e.g. "eip155:1/slip44:60").
        Symbol:
          type: string
          description: Asset symbol (e.g. "BTC", "ETH").
        TestNetwork:
          type: boolean
          description: Whether the chain is a test network.
    cwpAddCantonTokenIntent:
      type: object
      description: Intent to add a Canton token.
      additionalProperties: false
      required:
        - Symbol
        - Chain
        - Registrar
        - InstrumentID
        - Decimals
        - Name
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        Symbol:
          type: string
        Chain:
          type: string
        ChainName:
          type: string
          description: Canonical name of the chain (e.g. "Canton Testnet").
        Registrar:
          type: string
          description: Token registrar, also used as instrument admin
        InstrumentID:
          type: string
        TestNetwork:
          type: boolean
          default: false
        Decimals:
          type: integer
        Name:
          type: string
          description: Human-readable token name
    cwpRegisterTokenIntent:
      type: object
      description: Intent to register a token.
      additionalProperties: false
      required:
        - CAIP19
        - Symbol
        - Decimals
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        CAIP19:
          type: string
          description: CAIP-19 asset identifier.
        Symbol:
          type: string
          description: Token symbol.
        Decimals:
          type: integer
          description: Number of decimal places.
    cwpRegisterCustomChainIntent:
      type: object
      description: >
        Intent to register a custom chain and its native asset.

        The CAIP-2 chain ID and SLIP-44 coin type are derived from the CAIP19
        (CAIP-19) field.

        The native asset must use the slip44 namespace. The chain family must be
        known (eip155, bip122, solana, etc.).
      additionalProperties: false
      required:
        - ChainName
        - CAIP19
        - NativeAssetSymbol
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        ChainName:
          type: string
          description: Unique human-readable name for the chain (e.g. "Ethereum Mainnet").
        TestNet:
          type: boolean
          description: Whether this is a test network.
          default: false
        CAIP19:
          type: string
          description: >-
            CAIP-19 of the native asset (e.g. "eip155:1/slip44:60"). Chain ID
            (CAIP-2) and coin type (SLIP-44) are derived from this.
        NativeAssetSymbol:
          type: string
          description: Ticker symbol for the native asset (e.g. "ETH").
        NativeAssetDecimals:
          type: integer
          description: Number of decimal places for the native asset.
          default: 0
    cwpRegisterKnownChainRequest:
      type: object
      description: Request to register a chain from the built-in chain registry.
      additionalProperties: false
      required:
        - CAIP2
      properties:
        CAIP2:
          type: string
          description: CAIP-2 chain identifier (e.g. "eip155:1" for Ethereum mainnet).
    cwpUpdateConfigRestrictionIntent:
      type: object
      description: >-
        Intent to update config restrictions. At least one of Add or Delete must
        be set; both are allowed.
      additionalProperties: false
      anyOf:
        - required:
            - Add
        - required:
            - Delete
      properties:
        OperationID:
          type: string
          description: Optional. Auto-generated if omitted.
          pattern: ^[a-zA-Z0-9-]{1,96}$
        InitiatorID:
          type: string
          description: Required when confirmation is enabled.
        Add:
          $ref: '#/components/schemas/cwpConfigRestriction'
          description: Optional. Restriction to add.
        Delete:
          $ref: '#/components/schemas/cwpConfigRestriction'
          description: Optional. Restriction to delete.
    cwpUpdatePolicyRestrictionIntent:
      type: object
      description: >-
        Intent to update policy restrictions. At least one of Add or Delete must
