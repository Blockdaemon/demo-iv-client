openapi: 3.1.0
info:
  contact:
    email: info@blockdaemon.com
    name: Blockdaemon
    url: https://blockdaemon.com
  title: Institutional Wallet
  version: 2.0.0
servers:
  - url: https://{domain}
    variables:
      domain:
        default: api.your-wallet.blockdaemon-wallet.com
        description: The domain name of the server
tags:
  - name: Accounts
    x-displayName: Accounts
  - name: Addresses
    x-displayName: Addresses
  - name: Assets
    x-displayName: Assets
  - name: Audit Logs
    x-displayName: Audit Logs
  - name: Cold Wallet
    x-displayName: Cold Wallet
  - name: Config
    x-displayName: Config
  - name: Events
    x-displayName: Events
  - name: Groups
    x-displayName: Groups
  - name: Key Backups
    x-displayName: Key Backups
  - name: Policies
    x-displayName: Policies
  - name: Compliance
    x-displayName: Compliance
  - name: Staking
    x-displayName: Staking
  - name: Automated Approvers
    x-displayName: Automated Approvers
  - name: Transactions
    x-displayName: Transactions
  - name: Operations
    x-displayName: Operations
  - name: Users
    x-displayName: Users
  - name: Health
    x-displayName: Health
  - name: CWP Operations
    x-displayName: CWP Operations
  - name: CWP WalletConnect
    x-displayName: CWP WalletConnect
paths:
  /api/v2/accounts:
    get:
      operationId: listAccounts
      summary: List all accounts in wallet
      description: Retrieve a list of all accounts in the wallet.
      tags:
        - Accounts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createAccount
      summary: Create new account
      description: Add a new account to the wallet.
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - config
              properties:
                name:
                  $ref: '#/components/schemas/Name'
                config:
                  $ref: '#/components/schemas/AccountConfigPost'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/accounts/{accountID}:
    get:
      operationId: getAccount
      summary: Get account by ID
      description: Retrieve details of a specific account.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/AccountIDPath'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: patchAccount
      summary: Partially update an account
      description: Set the active state of an account.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/AccountIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/accounts/{accountID}/validators:
    get:
      operationId: listAccountValidators
      summary: List account's validators
      description: Returns a list of staking validators of the account.
      tags:
        - Accounts
        - Staking
      parameters:
        - $ref: '#/components/parameters/AccountIDPath'
        - in: query
          name: cache
          description: Whether to use cached data. Default to true if not set.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/assets:
    get:
      operationId: listAssets
      summary: List all assets in wallet
      description: Retrieve a list of all assets in the wallet.
      tags:
        - Assets
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  more:
                    $ref: '#/components/schemas/More'
                required:
                  - list
                  - more
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createAsset
      summary: Add asset to wallet
      description: Add an ERC-20 token to the wallet.
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPost'
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/assets/{assetID}:
    get:
      operationId: getAsset
      summary: Get asset by ID
      description: Retrieve details of a specific asset.
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/AssetIDPath'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: patchAsset
      summary: Partially update an asset
      description: Set the exchange rate of an asset.
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/AssetIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRate'
      responses:
        '200':
          description: Asset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/assets/{assetID}/validators:
    get:
      operationId: listAssetValidators
      summary: List asset validators
      description: Returns a list of staking validators of the asset.
      tags:
        - Assets
        - Staking
      parameters:
        - $ref: '#/components/parameters/AssetIDPath'
        - in: query
          name: cache
          description: Whether to use cached data. Default to true if not set.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/accounts/{accountID}/assets:
    post:
      operationId: addAssetToAccount
      summary: Add existing asset to account
      description: >-
        Add an existing asset to an account by asset ID. The asset must already
        exist in the wallet.
      tags:
        - Accounts
        - Assets
      parameters:
        - $ref: '#/components/parameters/AccountIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetToAccountPost'
      responses:
        '201':
          description: Asset added to account successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Asset already exists in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/audit-logs/download:
    get:
      operationId: listAuditLogsByDownload
      summary: Download audit logs
      description: Download the list of audit-logs as a zip file.
      tags:
        - Audit Logs
      parameters:
        - name: start_date
          description: Start date parameter for audit logs export
          in: query
          required: true
          schema:
            type: string
        - name: end_date
          description: End date parameter for audit logs export
          in: query
          required: true
          schema:
            type: string
        - name: user_filter
          description: >-
            Boolean parameter for specifying whether to filter audit logs down
            to user events
          in: query
          schema:
            type: boolean
        - name: policy_filter
          description: >-
            Boolean parameter for specifying whether to filter audit logs down
            to policy events
          in: query
          schema:
            type: boolean
        - name: staking_filter
          description: >-
            Boolean parameter for specifying whether to filter audit logs down
            to staking events
          in: query
          schema:
            type: boolean
        - name: fee_filter
          description: >-
            Boolean parameter for specifying whether to filter audit logs down
            to gas/fee-burning events
          in: query
          schema:
            type: boolean
        - name: smart_contract_filter
          description: >-
            Boolean parameter for specifying whether to filter audit logs down
            to smart contract events
          in: query
          schema:
            type: boolean
        - name: columns
          description: >-
            Comma-separated list of columns you want to appear in the final
            output .csv
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                example: attachment; filename="audit-logs.zip"
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/batches:
    get:
      operationId: listBatches
      summary: List batches
      description: >-
        Retrieve a list of transaction batches with optional filtering for
        in-progress batches.
      parameters:
        - name: inProgress
          in: query
          description: |
            Whether to include batches that are in progress, i.e not in the
            final statuses - `finished` and `deleted`. Currently only return the
            oldest batch to cater to FE.
          schema:
            type: boolean
      responses:
        '200':
          description: Batches listed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Batch'
                  more:
                    $ref: '#/components/schemas/More'
                required:
                  - list
                  - more
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cold Wallet
  /api/v2/batches/{batchID}:
    parameters:
      - description: Batch ID
        in: path
        name: batchID
        required: true
        schema:
          format: int64
          type: integer
    get:
      operationId: getBatch
      summary: Get batch by ID
      description: Retrieve details of a specific transaction batch.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Cold Wallet
    delete:
      operationId: deleteBatch
      summary: Delete batch
      description: >-
        Update the batch status to deleted. Once deleted, the batch cannot be
        recovered.
      tags:
        - Cold Wallet
      responses:
        '200':
          description: Batch deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: patchBatch
      summary: Update batch
      description: Only the status can be updated and it can only be updated to created.
      tags:
        - Cold Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPatch'
      responses:
        '200':
          description: Batch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/batches/{batchID}/download:
    description: Download the unsigned batch identified by batch ID.
    parameters:
      - description: Batch ID
        in: path
        name: batchID
        required: true
        schema:
          format: int64
          type: integer
    get:
      operationId: getColdBatchByDownload
      summary: Download batch
      description: >-
        Download the unsigned batch identified by batch ID for cold wallet
        signing.
      tags:
        - Cold Wallet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: string
                  master_key_id:
                    type: string
                  encrypted_transaction_batch:
                    type: string
                required:
                  - signature
                  - master_key_id
                  - encrypted_transaction_batch
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/batches/{batchID}/signed/upload:
    description: |
      Upload the signed version of the batch identified by batch ID. Once the
      required count of signatures is reached, the batch will be finalized.
    parameters:
      - description: Batch ID
        in: path
        name: batchID
        required: true
        schema:
          format: int64
          type: integer
    post:
      operationId: postSignedColdBatchByUpload
      summary: Upload signed batch
      description: >-
        Upload the signed version of the batch identified by batch ID. Once the
        required count of signatures is reached, the batch will be finalized.
      tags:
        - Cold Wallet
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                signed_transaction_batch:
                  format: binary
                  type: string
                  description: An array of signed transaction batches (by cold wallets)
      responses:
        '201':
          description: Signed batch successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/cold-pairing-messages/upload:
    description: >-
      The endpoint only accepts HTTP POST. Theoretically there might be multiple
      cold wallets in the system.
    post:
      operationId: createColdPairingMessageByUpload
      summary: Upload cold pairing message
      description: >-
        Upload the cold wallet's pairing message after the cold wallet has
        received the pairing message from the hot wallet
      tags:
        - Cold Wallet
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cold_pairing_message:
                  type: string
                  format: binary
      responses:
        '201':
          description: Cold pairing message successfully uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/config:
    get:
      operationId: getConfig
      summary: Retrieve config for wallet
      description: Retrieve the application configuration for the wallet.
      tags:
        - Config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      operationId: patchConfig
      summary: Partially update the wallet config
      description: >-
        frozen or not, compliance or other dynamic behavior which should be as
        minimal as possible; whether or not the event streaming service is
        active
      tags:
        - Config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                frozen:
                  type: boolean
      responses:
        '200':
          description: Config updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v2/events:
    description: Events are interesting status changes of API resources.
    get:
      operationId: listEvents
      summary: List events
      description: Retrieve a list of events representing status changes of API resources.
      tags:
        - Events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  more:
                    $ref: '#/components/schemas/More'
                required:
                  - list
                  - more
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/events/ws-receive:
    description: |
      This path should only has one verb - GET. The details of this path can be
      found in `asyncapi.yaml` next to this file.
    get:
      operationId: wsReceiveEvents
      summary: WebSocket events
      description: >-
        Establish a WebSocket connection to receive real-time events. See
        asyncapi.yaml for detailed specifications.
      tags:
        - Events
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v2/groups:
    get:
      operationId: listGroups
      summary: List groups
      description: Retrieve a list of all groups in the wallet.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  more:
                    $ref: '#/components/schemas/More'
                required:
                  - list
                  - more
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Groups
    post:
      operationId: createGroup
      summary: Create group
      description: Create a new group in the wallet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPost'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Groups
  /api/v2/groups/{groupID}:
    parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        schema:
          format: int64
          type: integer
    get:
      operationId: getGroup
      summary: Get group by ID
      description: Retrieve details of a specific group.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
