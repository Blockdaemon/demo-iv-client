        data:
          type: object
          additionalProperties: true
          description: Additional error data. Only for MPA system errors.
  responses:
    BadRequest:
      description: >-
        The request was invalid, included validation errors, or cannot be
        served.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The server understood the request but refuses to authorize it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: The server has encountered a situation it doesn't know how to handle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: The server is not ready to handle requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required and has failed or has not been provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    cwpBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpNotFound:
      description: Resource not found (operation or tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpConflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    cwpInternalError:
      description: >
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data`

        from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cwpErrorResponse'
    CwpWalletConnectBadRequest:
      description: Invalid input, validation error, or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectNotFound:
      description: Resource not found (session or tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
    CwpWalletConnectInternalError:
      description: >
        Internal server error. May include an `errorCode` (M-prefixed) and
        `data`

        from the MPA error code system. See `cwpapi/errors.go` for codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CwpWalletConnectErrorResponse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: authorization
      description: API key for authentication (no Bearer prefix required)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
