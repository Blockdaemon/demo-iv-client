        UTXOExclude:
          type: array
          items:
            type: object
            properties:
              TxID:
                type: string
              Index:
                type: integer
          description: UTXOs that must be excluded.
    cwpSubstrateSpec:
      type: object
      description: Optional Substrate-specific parameters.
      properties:
