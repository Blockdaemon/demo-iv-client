    get:
      operationId: getTransaction
      summary: Get transaction by ID
      description: Retrieve details of a specific transaction.
      tags:
        - Transactions
      parameters:
        - name: transactionID
          schema:
            $ref: '#/components/schemas/TransactionID'
          description: ID of the transaction
          in: path
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: cancelTransaction
      summary: Cancel a transaction
      description: >
        Cancel a pending transaction by cancelling its underlying MPA operation.

        This will set the transaction's status to "Cancelled". Only transactions

        that are not yet in a final state (Succeeded, Failed, Cancelled,
        Rejected,

        Error) can be cancelled.
      tags:
        - Transactions
      parameters:
        - name: transactionID
          schema:
            $ref: '#/components/schemas/TransactionID'
          description: ID of the transaction to cancel
          in: path
          required: true
      responses:
        '204':
          description: Transaction cancelled successfully
        '400':
          $ref: '#/components/responses/BadRequest'
          description: >-
            Transaction cannot be cancelled (e.g., already in final state, no
            associated MPA operation)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Transaction not found
        '409':
          description: Operation cannot be cancelled (already in final state)
        '500':
          $ref: '#/components/responses/InternalServerError'
