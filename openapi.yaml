  /api/cwp/operations/start/fundSubaddresses:
    post:
      summary: Start Fund Subaddresses operation
      description: >
        Start an async Fund Subaddresses operation. Distributes funds from the
        main address to multiple sub-addresses.

        Status can be queried with [`GET
        /operations/id/{operationID}/status`](#/paths/~1operations~1id~1{operationID}~1status/get).
      operationId: cwpstartFundSubaddresses
