  /api/cwp/address/get:
    post:
      summary: Get address
      description: >
        Gets an address for the native asset in the specified master key and
        account.

        For a given (masterKey, account, symbol, testnet), a previously unused
        index can only

        take a value one greater than the maximal previously used index (zero if
        no previous calls).
      operationId: cwpgetAddress
      requestBody:
